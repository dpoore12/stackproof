pricing_note: 'Service Autopilot publishes flat monthly prices for Startup, Pro, and Pro Plus, but the underlying seat-count formula is not fully captured: Startup and Pro state no user-license count at all (the FAQ defers to a sales demo "to get the right number of licenses"), only Pro Plus states an explicit count (5 mobile + 1 business = 6 users) and Elite (8 mobile + 2 business = 10 users, no price published). Every tier also carries an unquantified one-time "sign up fee" on top of the monthly rate. Because the seat formula and the sign-up fee are both uncaptured, all tiers are recorded compare: false as starting figures.'

