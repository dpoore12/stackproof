pricing_note: "Pro and Team are priced identically at $6/user/month billed monthly; the only difference is that Pro is capped at exactly 1 user while Team scales up to 1,000 users, per Cacoo's own FAQ (\"the Pro plan is designed for a single user\"). Annual billing saves 17% per the page's toggle, but the exact annual per-user dollar figure was not printed in the captured text, only the percentage, so it is not recorded here."

