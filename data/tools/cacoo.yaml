clauses:
  - topic: cancellation
    status: stated
    quote: "You can switch from one paid plan to another after your existing plan period is finished, so that it will be active for the next period, whether this is monthly or annually. It is not possible to downgrade to a free plan from a paid one."
    finding: >-
      Cacoo lets customers switch paid plans only at the end of the
      current billing period, and explicitly does not allow downgrading
      from a paid plan back to Free (2026-09-04).
    provenance:
      source_url: https://cacoo.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    quote: "You can sign up for a 14-day free trial of any Cacoo paid plan, no credit card required. After the 14 days, you will need to pay for the plan to continue using Cacoo."
    finding: >-
      Cacoo's 14-day trial requires no card up front, but access ends
      after 14 days unless a plan is purchased (2026-09-04).
    provenance:
      source_url: https://cacoo.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: not_stated
    finding: >-
      Cacoo's pricing FAQ states no money-back-guarantee or refund terms,
      though it does state "there are no hidden fees" (2026-09-04).
    provenance:
      source_url: https://cacoo.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: cacoo-pro-team-same-rate
    claim: >-
      Cacoo's Pro and Team plans are priced identically at $6 per user per
      month; the only difference is that Pro is capped at exactly 1 user
      while Team scales up to 1,000 users (2026-09-04).
    provenance:
      source_url: https://cacoo.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: cacoo-no-mid-trial-plan-switch
    claim: >-
      Cacoo's FAQ states it is "not possible to switch plans during the
      free trial period," unlike some competitors that allow mid-trial
      upgrades (2026-09-04).
    provenance:
      source_url: https://cacoo.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
