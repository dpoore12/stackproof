findings:
  - id: goodaccess-gateway-fee-both-tiers
    claim: >-
      GoodAccess charges "$49/mo per dedicated gateway" as a required
      add-on on both its Essential and Premium plans, so a minimum
      5-user Essential team's real monthly floor is $35 (5 x $7) plus
      $49, not $35 alone (2026-09-04).
    provenance:
      source_url: https://www.goodaccess.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: goodaccess-enterprise-user-floor
    claim: >-
      GoodAccess's Enterprise tier is priced "On Request" with a stated
      "minimum 50 users," a much higher floor than the 5-user minimum on
      Essential and Premium (2026-09-04).
    provenance:
      source_url: https://www.goodaccess.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: goodaccess-annual-discount
    claim: >-
      GoodAccess advertises "Saving extra 20% with annual billing," and
      its own printed monthly-vs-annual figures ($9 vs $7 on Essential,
      $14 vs $11 on Premium) are consistent with roughly a 20-22%
      discount for annual commitment (2026-09-04).
    provenance:
      source_url: https://www.goodaccess.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
