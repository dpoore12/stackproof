free_trial: "Full-featured 14-day free trial, no credit card required (stated 2026-09-04)."
pricing_note: "Both priced tiers show two figures in the rendered page at once (the same duplicate-DOM-node pattern seen elsewhere in this dataset for billing-toggle prices): a lower figure paired with 'Annually' and a higher one paired with 'Monthly'. The ratio between them (Essential $7 vs $9, Premium $11 vs $14) is consistent with the page's own 'Saving extra 20% with annual billing' banner, so the lower figures are recorded as the annual-billed tiers and the higher as monthly-billed. Both tiers require a minimum of 5 users and at least one dedicated gateway at $49/month, billed separately from the per-user price."

