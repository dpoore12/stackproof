      note: '"Pro. Perfect for professional businesses. $51 USD per user/month." Everything in Lite, plus custom branding, inquiry form & email inbox, job photos & files, recurring jobs, job templates, progress invoicing, timesheets, subcontractor scheduling.'
  - plan: Plus
    base_monthly_usd: 0
    per_seat_monthly_usd: 61
    seat_label: user
    billing: monthly
    provenance:
      source_url: https://www.tradifyhq.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Plus. Additional features for total control. $61 USD per user/month." Everything in Pro, plus SmartTools AI features (SmartRead for bills, SmartWrite), service reminders, job tasks, purchase orders, bulk invoicing, reporting.'
  - plan: Custom
    compare: false
    standalone: false
    base_monthly_usd: 0
    per_seat_monthly_usd: 0
    seat_label: user
    billing: monthly
