findings:
  - id: tradify-genuinely-per-user
    claim: >-
      Tradify prices Lite, Pro, and Plus purely per user with no base
      fee -- "$47," "$51," and "$61 USD per user/month" respectively,
      each stated with no included-seats floor (2026-09-04).
    provenance:
      source_url: https://www.tradifyhq.com/pricing
