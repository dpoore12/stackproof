clauses:
  - topic: refund
    status: stated
    finding: >-
      Workable's AI credits are non-refundable and expire 1 year from
      purchase; no refund terms are given for the plans themselves
      (2026-09-04).
    quote: "AI credits expire 1 year from purchase. Non-refundable."
    provenance:
      source_url: https://www.workable.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: stated
    finding: >-
      Workable lists "Data export capabilities" and "Candidate data
      retention rules" among features in all plans, without stating a
      post-cancellation export window (2026-09-04).
    provenance:
      source_url: https://www.workable.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: cancellation
    status: not_stated
    finding: >-
      Workable's pricing page states no cancellation terms (2026-09-04).
    provenance:
      source_url: https://www.workable.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: workable-employee-band-pricing
    claim: >-
      Workable prices by company size in 9 employee bands from 1-20 to
      1000+, with the 1-20 band at $299 (Standard), $599 (Premier) and
      $719 (Enterprise) a month; Premier and Enterprise are annual-only
      (2026-09-04).
    provenance:
      source_url: https://www.workable.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: workable-addon-stack
    claim: >-
      Workable's Standard plan sells texting ($89), video interviews ($109),
      assessments ($59) and performance ($39) as monthly add-ons worth $296
      combined, which is roughly the $300 gap to Premier (2026-09-04).
    provenance:
      source_url: https://www.workable.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: workable-ai-credit-pricing
    claim: >-
      Workable's AI agent charges 1 credit per candidate evaluation, 2 per
      sourced candidate and 10 per candidate chat; credits cost $0.095 to
      $0.12 each in bundles of 5,000 to 50,000 after 3,000 free ones
      (2026-09-04).
    provenance:
      source_url: https://www.workable.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: workable-annual-total-equals-monthly
    claim: >-
      Workable's cards advertise "SAVE 20%" on annual billing but the
      yearly totals printed at the 1-20 band ($3,588, $7,188, $8,628) are
      exactly 12 times the monthly figures (2026-09-04).
    provenance:
      source_url: https://www.workable.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
