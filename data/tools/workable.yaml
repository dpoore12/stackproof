slug: workable
vendor: Workable
product: Workable
category: recruiting
url: https://www.workable.com/pricing
free_trial: "15-day free trial of the Standard feature set, no credit card; the trial excludes the AI agent (stated 2026-09-04)."
pricing_note: "Flat plan fee per company, priced by an employee-count band. The page rendered the default 1 to 20 employee band, so the tiers are capped at 20 employees; larger bands are priced by a dropdown that was not selected. The yearly totals printed beside the monthly figures equal 12 times the monthly figure, so the annual discount is not shown at this band."

