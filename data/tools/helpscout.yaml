findings:
  - id: helpscout-free-plan-limits
    claim: >-
      Help Scout's Free plan on 2026-09-03 includes 5 users, 1 shared Inbox
      and 1 Docs site, with no payment method required.
    provenance:
      source_url: https://www.helpscout.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: helpscout-inbox-caps-by-plan
    claim: >-
      Help Scout caps shared inboxes by plan — 1 on Free, 20 on Standard, 50
      on Plus, unlimited on Pro (stated 2026-09-03).
    provenance:
      source_url: https://www.helpscout.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: helpscout-trial-terms
    claim: >-
      Help Scout's Standard and Plus plans carry a 15-day free trial with no
      credit card; the Pro plan is trialled only through its sales team
      (2026-09-03).
    provenance:
      source_url: https://www.helpscout.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
