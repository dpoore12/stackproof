slug: figma
vendor: Figma
product: Figma (FigJam whiteboard seat)
category: whiteboarding
url: https://www.figma.com/pricing/
free_trial: "No separate paid trial; Starter (free) itself runs indefinitely with unlimited drafts and 150 AI credits/day (2026-09-04)."
pricing_note: "Figma sells one unified per-seat price ladder across its whole suite (Design, FigJam, Slides, Draw, etc.), not a standalone whiteboard product, with three seat types: Full seat (everything), Dev seat (Dev Mode + FigJam + Slides + Buzz, view/comment on Design), and Collab seat (full FigJam + Slides + Buzz, view/comment on Design and basic Dev Mode inspection). Because this category is specifically about whiteboarding, the Collab seat -- the cheapest seat type with full FigJam access -- is used as Figma's comparable price here; Full and Dev seat prices are recorded as reference tiers only (compare: false) since they price the entire design suite, not just the whiteboard. The page states \"Prices in USD.\" Professional's price is shown behind a Monthly/Annual toggle; which state this specific fetch captured is not certain from the static text, so it is recorded here as the monthly rate pending disambiguation. Organization and Enterprise are explicitly \"Billed annually.\""

