clauses:
  - topic: cancellation
    status: stated
    quote: "If you're on the Professional plan, you can downgrade or cancel your plan your Admin Dashboard. If you're on an Organization or Enterprise plan, please contact our Sales team to downgrade or cancel your plan."
    finding: >-
      Figma lets Professional-plan customers self-serve cancel from the
      Admin Dashboard, but Organization and Enterprise customers must
      contact sales to cancel (2026-09-04).
    provenance:
      source_url: https://www.figma.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    quote: "If you're on a Professional plan, if you add new paid seats to your team during your annual subscription term, Figma charges you a separate monthly subscription for those seats at the monthly price."
    finding: >-
      Figma bills new seats added mid-term on an annual Professional plan
      as a separate monthly subscription at the monthly rate, rather than
      prorating the annual rate (2026-09-04).
    provenance:
      source_url: https://www.figma.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: not_stated
    finding: >-
      Figma's pricing FAQ states no money-back-guarantee or refund terms
      (2026-09-04).
    provenance:
      source_url: https://www.figma.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: figma-seat-types
    claim: >-
      Figma's FAQ defines three seat types: "Full seat" (entire suite),
      "Dev seat" (Dev Mode plus FigJam/Slides/Buzz), and "Collab seat"
      (FigJam/Slides/Buzz plus basic Dev Mode inspection) (2026-09-04).
    provenance:
      source_url: https://www.figma.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: figma-unlimited-viewers
    claim: >-
      Figma states, "Invite as many people as you want to view, comment,
      inspect, or export from your Figma files—for free!" independent of
      seat count (2026-09-04).
    provenance:
      source_url: https://www.figma.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: figma-ai-credits-by-seat-type
    claim: >-
      Figma's Full seats get 3,000 to 4,250 AI credits/month depending on
      plan, while Collab, Dev, and View seats all receive a flat 500
      credits/month (2026-09-04).
    provenance:
      source_url: https://www.figma.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
