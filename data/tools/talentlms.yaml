pricing_note: "TalentLMS's Core and Grow tiers price via an interactive user-count slider (bands like \"1-40 users\", \"41-70 users\", ... \"801-1000 users\"); this fetch captured only the price at each tier's default-selected band, so Core is recorded up to 40 users and Grow up to 70 users even though the vendor sells both tiers to a higher stated cap (100 and 500 users respectively) at bands this fetch did not capture. The Pro tier is fully specified: a flat $449/month covers up to 100 users, plus a stated $6/additional user up to a tooltip-confirmed cap of 500 users."

