findings:
  - id: acuity-flat-plans-annual-monthly
    claim: >-
      On 2026-09-03 Acuity listed Starter at $16, Standard at $27 and
      Premium at $49 per month paid annually, or $20, $34 and $61 paid
      monthly, each covering a whole account.
    provenance:
      source_url: https://www.acuityscheduling.com/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - id: acuity-calendar-caps
    claim: >-
      Acuity caps calendars at 1 on Starter, 6 on Standard and 36 on
      Premium, so a 7-person team needs the $49 Premium plan (2026-09-03).
    provenance:
      source_url: https://www.acuityscheduling.com/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - id: acuity-vs-per-seat-five-users
    claim: >-
      For 5 people Acuity Standard costs $27 per month flat, against $50 on
      Calendly Standard at its 2026-09-03 yearly rate.
    provenance:
      source_url: https://www.acuityscheduling.com/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - id: acuity-premium-hipaa-and-branding
    claim: >-
      A signed HIPAA BAA and removal of the "Powered by Acuity" footer are
      Premium-only at $49 per month (2026-09-03).
    provenance:
      source_url: https://www.acuityscheduling.com/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - id: acuity-trial-seven-days
    claim: >-
      Acuity offers a 7-day trial of any plan without a credit card and no
      free plan on its pricing page (2026-09-03).
    provenance:
      source_url: https://www.acuityscheduling.com/pricing
      fetched_at: 2026-09-03
      method: live_fetch
