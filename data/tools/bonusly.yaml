fees:
  - name: Bizy AI (standalone add-on beyond what's bundled)
    amount_usd: 2
    unit: per user, per month
    provenance:
      source_url: https://www.bonusly.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

clauses:
  - topic: billing_timing
    status: stated
    quote: "All our plans are billed annually, providing a full year of engagement and recognition for your team."
    finding: >-
      Bonusly describes its plans as billed annually in its FAQ, though
      the pricing page itself also shows a monthly-billing toggle with
      its own listed rate (2026-09-04).
    provenance:
      source_url: https://www.bonusly.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: stated
    quote: "You'll pay face value for rewards when employees redeem from the Bonusly Reward Catalog—for example, a $10 Amazon gift card costs you $10... you'll never pay for unused funds."
    finding: >-
      Bonusly states customers never pay for unused reward funds, since
      rewards are billed at face value only when redeemed (2026-09-04).
    provenance:
      source_url: https://www.bonusly.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: cancellation
    status: not_stated
    finding: >-
      Bonusly's pricing FAQ states no subscription-cancellation terms
      beyond its reward-funding policy (2026-09-04).
    provenance:
      source_url: https://www.bonusly.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: bonusly-no-seat-limit
    claim: >-
      Bonusly's FAQ states, "No. Our plans are designed to scale,
      accommodating teams of all sizes without any user limits," on
      every paid plan (2026-09-04).
    provenance:
      source_url: https://www.bonusly.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: bonusly-rewards-billed-separately
    claim: >-
      Bonusly bills reward redemptions (e.g. gift cards) separately from
      the subscription at face value, with no markup and no charge for
      unredeemed budget (2026-09-04).
    provenance:
      source_url: https://www.bonusly.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
