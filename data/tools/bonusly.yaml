slug: bonusly
vendor: Bonusly (Smartly, Inc)
product: Bonusly
category: performance_management
url: https://www.bonusly.com/pricing
free_trial: "30-day free trial of the Team plan (with Bizy AI included), no credit card required; unselected trials fall back to the free Free plan (2026-09-04)."
pricing_note: "Bonusly is primarily a peer-recognition and engagement product with 1:1s, check-ins, and performance recaps bundled in -- included here because Lattice and 15Five both bundle the same \"engagement\" concept into their core performance-management packages, so this dataset treats recognition/engagement as part of the same buying category. The Team plan is sold in two variants: with Bizy AI (the default, $5/month billed monthly or $50/year billed annually) or without it ($3/month billed monthly or $30/year billed annually) -- both are real, independently purchasable options, so both are recorded as comparable tiers. There is no seat limit stated on any paid plan."

