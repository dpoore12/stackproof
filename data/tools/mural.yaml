findings:
  - id: mural-seat-definition
    claim: >-
      Mural's FAQ states, "No, Mural offers flexible ways to collaborate
      so that creative ideas and innovation aren't limited by logins.
      Purchase seats for your core collaborators" only (2026-09-04).
    provenance:
      source_url: https://www.mural.co/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: mural-guest-access-tiering
    claim: >-
      Mural gates ongoing guest access behind plan tier: Free and Team+
      have no guest role, while Business and Enterprise both include
      "unlimited guests" for outside collaborators (2026-09-04).
    provenance:
      source_url: https://www.mural.co/pricing
      fetched_at: 2026-09-04
      method: live_fetch
