findings:
  - id: livestorm-no-shows-free
    claim: >-
      Livestorm's FAQ states "people who register but never show up are
      not counted, so you never pay for no shows," and a person attending
      both live and the replay of the same session is "only counted once
      for that session" (2026-09-04).
    provenance:
      source_url: https://livestorm.co/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: livestorm-team-members-free-vs-zoom
    claim: >-
      Livestorm explicitly contrasts its model with a competitor's in its
      own FAQ: "Zoom charges for your team members, while Livestorm does
      not. Your internal collaborators can join freely without consuming
      credits" (2026-09-04).
    provenance:
      source_url: https://livestorm.co/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: livestorm-quota-lockout
    claim: >-
      Livestorm's FAQ states that once an account fully reaches its
      attendee quota, "new attendees will not be able to join sessions
      until you upgrade" to a higher yearly credit tier (2026-09-04).
    provenance:
      source_url: https://livestorm.co/pricing
      fetched_at: 2026-09-04
      method: live_fetch
