clauses:
  - topic: cancellation
    status: stated
    finding: >-
      GoTo Meeting plans can be changed online at any time from the account
      page; no cancellation or refund terms are given (2026-09-04).
    quote: "You can make changes to your plan online at any time."
    provenance:
      source_url: https://www.goto.com/pricing/meeting
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: auto_renew
    status: stated
    finding: >-
      GoTo Meeting's trial takes no payment details and notifies the user
      before expiry rather than converting automatically (2026-09-04).
    quote: "We will notify you before your trial expires, and you can decide to subscribe to a paid plan or let your trial expire. No payment information required."
    provenance:
      source_url: https://www.goto.com/pricing/meeting
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      GoTo Meeting's pricing page states no data-export terms; Business
      includes unlimited cloud recording and transcripts (2026-09-04).
    provenance:
      source_url: https://www.goto.com/pricing/meeting
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: goto-meeting-annual-discount
    claim: >-
      GoTo Meeting's annual billing saves 14% on Professional ($12 vs $14
      per organizer a month) and 16% on Business ($16 vs $19), with annual
      totals of $144 and $192 (2026-09-04).
    provenance:
      source_url: https://www.goto.com/pricing/meeting
      fetched_at: 2026-09-04
      method: live_fetch
  - id: goto-meeting-participant-caps
    claim: >-
      GoTo Meeting caps meetings at 150 participants on Professional and 250
      on Business and Enterprise; audiences of 500 to 3,000 require GoTo
      Webinar (2026-09-04).
    provenance:
      source_url: https://www.goto.com/pricing/meeting
      fetched_at: 2026-09-04
      method: live_fetch
  - id: goto-meeting-no-addon-fees-claim
    claim: >-
      GoTo Meeting's FAQ promises no add-on fees or variable bills, while
      its compare table lists Enhanced Audio (toll-free numbers, Call Me,
      dial out) as an add-on on all 3 plans (2026-09-04).
    provenance:
      source_url: https://www.goto.com/pricing/meeting
      fetched_at: 2026-09-04
      method: live_fetch
  - id: goto-meeting-recording-tier
    claim: >-
      GoTo Meeting reserves unlimited cloud recording, transcription and AI
      meeting summaries for Business at $16 and above; Professional at $12
      lacks them (2026-09-04).
    provenance:
      source_url: https://www.goto.com/pricing/meeting
      fetched_at: 2026-09-04
      method: live_fetch
