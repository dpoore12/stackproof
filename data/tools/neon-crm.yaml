pricing_note: 'Neon CRM prices by organizational revenue, not by donor record count — its own page reportedly states "no donor record limits" and that pricing "scales based on how much money your organization raises." Direct fetches were blocked (HTTP 403, bot-blocked) twice, so these figures come from a search-engine synthesis of the vendor''s own page rather than a directly re-verified quote. Because there is no record-count cap on any tier, each tier''s price is identical at every seat point in this category''s comparison table. Add-on modules (Memberships, Events, Volunteers) carry a percentage surcharge on the CRM subscription fee.'

