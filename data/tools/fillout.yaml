findings:
  - id: fillout-unlimited-seats-all-plans
    claim: >-
      Fillout charges 1 flat fee per workspace with unlimited seats on Free,
      Starter, Pro and Business, so a 25-user team pays the same $15 a month
      on Starter as a single user (2026-09-04).
    provenance:
      source_url: https://www.fillout.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: fillout-response-caps
    claim: >-
      Fillout caps responses at 1,000 a month on Free, 2,000 on Starter and
      5,000 on Pro, with Business unlimited; over the cap forms keep
      collecting and the account can upgrade, buy bulk submissions or wait
      for the monthly reset (2026-09-04).
    provenance:
      source_url: https://www.fillout.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: fillout-annual-discount
    claim: >-
      Fillout's annual billing saves 20%: Starter $180 a year against $228
      monthly, Pro $480 against $588, Business $900 against $1,068
      (2026-09-04).
    provenance:
      source_url: https://www.fillout.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: fillout-usd-on-eu-gateway
    claim: >-
      Fillout rendered USD prices on 2026-09-04 even when fetched through a
      German gateway, unlike Typeform and Tally which switched to EUR on the
      same gateway; its page locale is fixed to en-US with 2 other locales.
    provenance:
      source_url: https://www.fillout.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: fillout-file-size-limit
    claim: >-
      Fillout limits uploads to 20 MB per file on Free, Starter and Pro and
      raises it to 1 GB or more on Business (2026-09-04).
    provenance:
      source_url: https://www.fillout.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
