clauses:
  - topic: cancellation
    status: stated
    finding: >-
      Fillout says subscriptions billed monthly or yearly can be cancelled at
      any time; no refund or end-of-term detail is given (2026-09-04).
    quote: "Yes, Fillout subscriptions are billed monthly or yearly and you can cancel your subscription at any time."
    provenance:
      source_url: https://www.fillout.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
