pricing_note: 'SingleOps is a sibling product to LMN under parent company Granum, built for tree care/arborist crews rather than general landscape crews, but sold through the same "green industry" pricing model. Each tier''s per-seat rate applies only to "office or sales users," not field crew, per the vendor''s own copy; the base price''s included office/sales user count is not stated explicitly, so 1 is assumed as the natural reading of a base-plan-plus-additional-user structure. Regular annual prices are recorded as primary tiers; monthly prices are recorded as `compare: false` secondary tiers, per this site''s standing convention.'

