findings:
  - id: webinarninja-single-price-dimension
    claim: >-
      Unlike every other vendor in this category, ProProfs WebinarNinja
      gates nothing by feature tier: unlimited webinars, registrants,
      co-presenters, replays, and AI tools are included at every
      attendee level, so price varies only by configured attendee
      capacity (2026-09-04).
    provenance:
      source_url: https://webinarninja.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: webinarninja-enterprise-threshold
    claim: >-
      ProProfs WebinarNinja's linear per-attendee rate applies only up to
      1,000 attendees; beyond that the page states "Enterprise pricing"
      applies and directs buyers to "talk to us" (2026-09-04).
    provenance:
      source_url: https://webinarninja.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: webinarninja-annual-discount-size
    claim: >-
      ProProfs WebinarNinja advertises "Save up to 50%" for annual
      billing, and its own promotional figures show exactly that: $0.6
      monthly vs. $0.3 annual per attendee, a full 50% reduction
      (2026-09-04).
    provenance:
      source_url: https://webinarninja.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
