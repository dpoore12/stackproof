findings:
  - id: jumpcloud-suspended-users-billed
    claim: >-
      JumpCloud's FAQ states "If a user is in a suspended state, is the user
      still billable? Yes. Suspended users are retained in the system
      during the time they are suspended and are billed as normal users"
      (2026-09-04).
    provenance:
      source_url: https://jumpcloud.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: jumpcloud-vat-exclusive
    claim: >-
      JumpCloud states its prices exclude Value Added Tax because it is
      "not a VAT registered entity" (2026-09-04).
    provenance:
      source_url: https://jumpcloud.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: jumpcloud-alacarte
    claim: >-
      Beyond its 3 packages, JumpCloud sells identity and device management
      features a la carte (Cloud Directory, MFA, SSO, Password Management
      each around $3-4/user/month), so a buyer can assemble a custom plan
      instead of a fixed package (2026-09-04).
    provenance:
      source_url: https://jumpcloud.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: jumpcloud-quote-tiers
    claim: >-
      JumpCloud's Platform Essentials (300 user maximum), Platform, and
      Platform Prime tiers are all quote-only with no published price,
      despite Platform Essentials advertising a hard user cap
      (2026-09-04).
    provenance:
      source_url: https://jumpcloud.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
