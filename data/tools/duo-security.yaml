      source_url: https://duo.com/editions-and-pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: duo-license-increments
    claim: >-
      Duo sells self-service licenses in blocks, not single seats: "for
      under 100 users, Duo licenses are purchased in increments of 10; for
      over 100 users, Duo licenses are purchased in increments of 25," so
      an 11-user team pays for 20 licenses (2026-09-04).
    provenance:
      source_url: https://duo.com/editions-and-pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: duo-free-full-price-ladder
    claim: >-
      Duo is the only vendor in this category with every tier self-serve
      priced with no quote-only ceiling: Free at $0, Essentials at $3,
      Advantage at $6 and Premier at $9 per user a month (2026-09-04).
    provenance:
      source_url: https://duo.com/editions-and-pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: duo-free-user-cap
    claim: >-
      Duo Free is capped at 10 users ("Best for small businesses with 10
      or fewer users"); an 11th user requires upgrading to a paid edition
      (2026-09-04).
    provenance:
      source_url: https://duo.com/editions-and-pricing
      fetched_at: 2026-09-04
      method: live_fetch
