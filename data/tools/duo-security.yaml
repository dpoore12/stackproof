clauses:
  - topic: billing_timing
    status: stated
    quote: "Modify your plan at any time"
    finding: >-
      Duo's pricing page states self-service subscription plans can be
      modified at any time, and that "for under 100 users, Duo licenses
      are purchased in increments of 10; for over 100 users, Duo licenses
      are purchased in increments of 25" (2026-09-04).
    provenance:
      source_url: https://duo.com/editions-and-pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: cancellation
    status: not_stated
    finding: >-
      Duo's pricing page states no cancellation terms (2026-09-04).
    provenance:
      source_url: https://duo.com/editions-and-pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      Duo's pricing page states no data-export terms (2026-09-04).
    provenance:
      source_url: https://duo.com/editions-and-pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: not_stated
