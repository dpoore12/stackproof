clauses:
  - topic: cancellation
    status: stated
    finding: >-
      Publer lets a subscription be cancelled anytime in Settings with paid
      access continuing to the end of the term, and auto-cancels after 3
      failed payments retried every 3 days (2026-09-04).
    quote: "You can continue to use the paid version until the end of the subscription / trial date, unless you request a refund."
    provenance:
      source_url: https://publer.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: stated
    finding: >-
      Publer refunds any payment in full within 14 days and pro-rata after
      that, with the yearly discount waived on late refunds; refunds are
      issued manually on request (2026-09-04).
    quote: "For each payment that you make, you have 14 days to request a full refund. After the 14 days, you're still eligible for a refund, but a pro-rated refund and the discount for paying yearly will be waived."
    provenance:
      source_url: https://publer.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: price_change
    status: stated
    finding: >-
      Publer grandfathers existing subscribers at their signup price and
      applies increases only to new customers (2026-09-04).
    quote: "As long as you have a subscription with us, we will never charge more than what you signed up for."
    provenance:
      source_url: https://publer.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_retention
    status: stated
    finding: >-
      Publer's Free plan keeps published posts on its servers for only 24
      hours, against unlimited history on paid plans (2026-09-04).
    quote: "In the free version, we will store the published posts on our servers for only 24 hours."
    provenance:
      source_url: https://publer.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      Publer's plans page states no data-export terms (2026-09-04).
    provenance:
      source_url: https://publer.com/plans
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: publer-per-account-pricing
    claim: >-
      Publer prices Professional at $4 and Business at $8 per social account
      a month on yearly billing, with every 10th social account and every
      10th additional member free (2026-09-04).
    provenance:
      source_url: https://publer.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
  - id: publer-eur-cards-usd-line
    claim: >-
      Publer's English plans page on 2026-09-04 printed EUR card prices
      (3,44 € and 6,89 € yearly) with a separate "Price in US Dollars" line
      for yearly billing only, and redirected 2 of 3 fetches to a German
      locale by IP.
    provenance:
      source_url: https://publer.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
  - id: publer-free-plan-limits
    claim: >-
      Publer's Free plan allows 3 social accounts excluding X, 10 scheduled
      posts per account and 25 saved drafts, and cannot connect X because of
      X's enterprise API cost (2026-09-04).
    provenance:
      source_url: https://publer.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
  - id: publer-payment-failure-cancel
    claim: >-
      Publer cancels a subscription automatically after 3 consecutive failed
      payments, retried every 3 days, and downgrades the account to Free
      (2026-09-04).
    provenance:
      source_url: https://publer.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
