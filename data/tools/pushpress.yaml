pricing_note: 'PushPress''s own feature comparison table confirms every tier is unlimited on every headcount dimension it lists -- "Members... Unlimited Unlimited Unlimited" and "Staff... Unlimited Unlimited Unlimited" identical across Free/Pro/Max -- so none of the three tiers caps or scales by active-member count; all three are flat monthly fees. The page''s own FAQ prose separately describes a different, apparently stale set of plan names and prices ("Core," "Core Pro $159/month," "Train," "Grow $329/month," "Full Stack ~$559/month") that do not match the visible Free/Pro/Max pricing cards actually used for checkout; disregarded in favor of the rendered cards.'

