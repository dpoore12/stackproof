findings:
  - id: screencloud-enterprise-quote-gated
    claim: >-
      ScreenCloud's Enterprise plan is "Annual Only" and fully
      quote-gated -- "Via email, +1 888 557 5328" -- with no dollar
      figure published anywhere on the pricing page (2026-09-04).
    provenance:
      source_url: https://screencloud.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: screencloud-free-device-discount
    claim: >-
      ScreenCloud includes a free media player device with any annual
      plan, or "17% off your first year" if you opt out of the device
      because you already own a player (2026-09-04).
    provenance:
      source_url: https://screencloud.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
