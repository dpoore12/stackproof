slug: okta-workforce
vendor: Okta
product: Okta Workforce Identity
category: identity_sso
url: https://www.okta.com/pricing/
free_trial: "30-day free trial on the Starter suite, no commitment required (stated 2026-09-04)."
pricing_note: "Workforce Identity is sold as per-user, per-month suites billed annually; the site separately sells Auth0-branded Customer Identity products, which are not covered by this record. Starter, Core Essentials and Essentials are self-serve priced; Professional and Enterprise are quote-only and not priced here. Every price carries an asterisk on the page; the footnote text was not located in the rendered page."

tiers:
  - plan: Starter
    base_monthly_usd: 6
    per_seat_monthly_usd: 6
    seat_label: user
    billing: annual
    provenance:
      source_url: https://www.okta.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Starter $6 per user/month* Includes: Single Sign-On, Multi-Factor Authentication, Universal Directory, 5 Workflows." FAQ confirms: "Our Starter Suite begins at $6 per user/month" and that suites are "billed annually."'
  - plan: Core Essentials
    base_monthly_usd: 14
