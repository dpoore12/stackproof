slug: typeform
vendor: Typeform
product: Typeform
category: forms
url: https://www.typeform.com/pricing/
free_trial: "14-day free trial of paid plans, plus a Free plan (stated 2026-09-04)."
pricing_note: "Only the Talent plan rendered in USD on 2026-09-04; three further fetches were geo-routed to EUR pricing, so Basic, Plus, Business and Growth Flow are recorded as EUR findings rather than tiers. Talent is priced per workspace with 3 users and is compared as a standalone plan."

# Talent is a flat per-workspace price that includes 3 users; there is no
# per-extra-user charge on the page, so it is capped at 3 seats.
tiers:
  - plan: Talent
    base_monthly_usd: 119
    per_seat_monthly_usd: 0
    included_seats: 3
    max_seats: 3
    seat_label: user
    billing: annual
    provenance:
      source_url: https://www.typeform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
      note: 'Browser-rendered fetch on a US gateway. "169 USD/mo (2,028 USD total /yr) — 119 USD/mo, Save 600 USD /yr — Includes 3,000 responses/mo, 3 users". 119 is the yearly base divided by 12.'
  - plan: Talent (monthly)
    base_monthly_usd: 169
    per_seat_monthly_usd: 0
    included_seats: 3
    max_seats: 3
    seat_label: user
    billing: monthly
    compare: false
    provenance:
      source_url: https://www.typeform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"169 USD/mo" on the monthly toggle; 2,028 USD per year.'

clauses:
  - topic: cancellation
    status: stated
    finding: >-
      Typeform applies a cancellation at the end of the prepaid period, keeps
      forms and collected responses, and may close forms to new responses
      and reduce the seat count (2026-09-04).
    quote: "Changes take effect at the end of the prepaid period"
    provenance:
      source_url: https://www.typeform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      Typeform's pricing page states no data-export terms beyond keeping
      responses after cancellation (2026-09-04).
    provenance:
      source_url: https://www.typeform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: typeform-response-caps
    claim: >-
      Every Typeform plan carries a monthly response cap: 100 on Basic, 1,000
      on Plus, 10,000 on Business and Growth Flow and 3,000 on Talent, with
      add-ons raising them to 750 / 2,500 / 50,000 / 50,000 / 7,500 and
      sales handling anything over 50,000 a month (2026-09-04).
    provenance:
      source_url: https://www.typeform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: typeform-pricing-geo-routed-eur
    claim: >-
      On 2026-09-04, 3 of 4 automated fetches of typeform.com/pricing were
      routed to EUR pricing, and the 1 USD render showed only the Talent plan,
      so Basic, Plus, Business and Growth Flow USD prices are not machine-recorded.
    provenance:
      source_url: https://www.typeform.com/pricing/
      fetched_at: 2026-09-04
      method: not_available
  - id: typeform-eur-plan-prices
    claim: >-
      Typeform's European page on 2026-09-04 listed Basic at €35 monthly or
      €25 per month yearly, Plus €70 / €49, Business €120 / €84 and Growth
      Flow €345 / €242, with 1 / 3 / 5 / 5 seats included.
    provenance:
      source_url: https://www.typeform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: typeform-annual-discount-mismatch
    claim: >-
      Typeform's billing toggle reads "Save 30%" for yearly billing while
      its FAQ says an annual plan saves "up to 16%"; the EUR card prices
      work out to 29% to 30% off (2026-09-04).
    provenance:
      source_url: https://www.typeform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: typeform-contacts-addon
    claim: >-
      Typeform's Contacts & Automations add-on costs €25 a month for 2,400
      actions (€21 on annual) or €79 a month for 12,000 actions (€66 on
      annual), is excluded from Free and Basic, and is bundled free on
      Business (2026-09-04).
    provenance:
      source_url: https://www.typeform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: typeform-talent-seats
    claim: >-
      Typeform Talent includes 3 users and 3,000 responses a month for $119
      a month on annual billing or $169 monthly, and lists no per-user
      add-on price (2026-09-04).
    provenance:
      source_url: https://www.typeform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
