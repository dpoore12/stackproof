pricing_note: 'Otuvy (formerly CleanTelligent) is a quality-management/inspection platform for building service contractors. QM Inspect explicitly states "5 users, unlimited service locations"; QM Pro adds work-order features on top with no restated user count, so the same 5-user cap is carried forward. QM Enterprise is quote-gated and excluded. A separate day-to-day operations product on the same pricing page, Otuvy Frontline, has a genuine base-plus-per-user formula and is recorded as its own tier.'

