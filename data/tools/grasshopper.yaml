slug: grasshopper
vendor: Grasshopper (GoTo)
product: Grasshopper
category: business_phone
url: https://grasshopper.com/pricing/
free_trial: "7-day free trial, no credit card required, plus a 7-day money-back guarantee (stated 2026-09-03)."

# Flat monthly price per account, not per user: Solo Plus and Small Business
# carry unlimited users. Shown with annual billing active ("billed annually
# at $168 / $300 / $660"); monthly-billing prices were not captured. The
# page advertised up to $75 off the first purchase at fetch time.
tiers:
  - plan: True Solo
    base_monthly_usd: 14
    per_seat_monthly_usd: 0
    seat_label: user
    max_seats: 1
    billing: annual
    provenance:
      source_url: https://grasshopper.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
      note: 'Browser-rendered fetch. "$14/mo billed annually at $168". 1 user, 1 number, 1 extension. Confirmed by JSON-LD price 14 USD.'
  - plan: Solo Plus
    base_monthly_usd: 25
    per_seat_monthly_usd: 0
    seat_label: user
    billing: annual
    provenance:
