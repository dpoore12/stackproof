      fetched_at: 2026-09-03
      method: live_fetch
      note: '"$25/mo billed annually at $300". Unlimited users, 1 number, 3 extensions. JSON-LD price 25 USD.'
  - plan: Small Business
    base_monthly_usd: 55
    per_seat_monthly_usd: 0
    seat_label: user
    billing: annual
    provenance:
      source_url: https://grasshopper.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
      note: '"$55/mo billed annually at $660". Unlimited users, 4 numbers, unlimited extensions. JSON-LD price 55 USD.'

