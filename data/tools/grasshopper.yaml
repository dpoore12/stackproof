clauses:
  - topic: cancellation
    status: stated
    finding: >-
      Grasshopper is sold monthly or annually with no contract; plan changes
      are allowed any time, upgrades apply immediately and downgrades from
      the next billing cycle; a 7-day money-back guarantee applies
      (2026-09-03).
    quote: "Grasshopper service is provided on a monthly or annual basis. You can make changes to your plan at any time."
    provenance:
      source_url: https://grasshopper.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - topic: billing_timing
    status: stated
    finding: >-
      Annual plans are billed up front at $168, $300 or $660; prices are
      subject to sales tax; international calls are excluded from unlimited
      minutes and billed per minute (2026-09-03).
    provenance:
      source_url: https://grasshopper.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      Grasshopper's pricing page states no data-export or number-porting-out
      terms (2026-09-03).
    provenance:
      source_url: https://grasshopper.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch

support:
  channels: [phone, live chat]
  hours: "24/7 support on every plan (per pricing page)"
  provenance:
    source_url: https://grasshopper.com/pricing/
    fetched_at: 2026-09-03
    method: live_fetch

findings:
  - id: grasshopper-flat-plans-annual
    claim: >-
      On 2026-09-03 Grasshopper listed True Solo at $14, Solo Plus at $25
      and Small Business at $55 per month billed annually ($168, $300 and
      $660 a year), with Solo Plus and Small Business covering unlimited
      users.
    provenance:
      source_url: https://grasshopper.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: grasshopper-per-account-vs-per-user
    claim: >-
      Because Grasshopper's Solo Plus is $25 per month for unlimited users,
      a 5-person team pays $25 against $75 on Quo Starter or $100 on RingEX
      Core, though it shares 1 number and 3 extensions (2026-09-03).
    provenance:
      source_url: https://grasshopper.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: grasshopper-texting-fees
    claim: >-
      Grasshopper business texting requires a $19.50 one-time carrier
      registration and a $1.50 monthly messaging fee on every plan
      (2026-09-03).
    provenance:
      source_url: https://grasshopper.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: grasshopper-extra-numbers-extensions
    claim: >-
      Extra Grasshopper phone numbers cost $9 per month each on any plan and
      extra extensions $3 per month on Solo Plus; Small Business includes 4
      numbers and unlimited extensions (2026-09-03).
    provenance:
      source_url: https://grasshopper.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: grasshopper-trial-and-guarantee
    claim: >-
      Grasshopper offers a 7-day free trial without a credit card and a
      7-day money-back guarantee, and advertised up to $75 off a first
      purchase on 2026-09-03.
    provenance:
      source_url: https://grasshopper.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
