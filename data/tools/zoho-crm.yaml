slug: zoho-crm
vendor: Zoho
product: Zoho CRM
category: crm
url: https://www.zoho.com/crm/zohocrm-pricing.html
free_trial: "A Free edition for up to 3 users, permanently, with leads, deals, workflows, reports and the mobile app (stated 2026-09-03)."
pricing_note: "The fetch was geo-routed to Zoho's German pricing page and plan prices are rendered by script; no USD figures were captured. Plan structure and terms were. Amounts pending a US-region fetch or verification on an account."

tiers: []

clauses:
  - topic: cancellation
    status: stated
    finding: >-
      Zoho CRM states there is no contractual commitment: it is pay-as-you-go
      billed monthly or annually, and the plan can be changed at any time
      (2026-09-03).
    provenance:
      source_url: https://www.zoho.com/crm/zohocrm-pricing.html
      fetched_at: 2026-09-03
      method: live_fetch
      note: "Stated on the German-language page the fetch was routed to."
  - topic: billing_timing
    status: stated
    finding: >-
      Zoho CRM accepts Visa, Mastercard, American Express and PayPal, and bank
      or check transfer for annual subscriptions; annual billing is advertised
      as saving up to 34% (2026-09-03).
    provenance:
      source_url: https://www.zoho.com/crm/zohocrm-pricing.html
      fetched_at: 2026-09-03
      method: live_fetch
  - topic: data_export
    status: needs_account
    finding: >-
      Data-export terms are not on Zoho CRM's pricing page (2026-09-03);
      pending verification on an account.
    provenance:
      source_url: https://www.zoho.com/crm/zohocrm-pricing.html
      fetched_at: 2026-09-03
      method: not_available

