slug: 1password
vendor: 1Password (AgileBits)
product: 1Password Business
category: password_manager
url: https://1password.com/pricing/business
free_trial: "14-day free trial of 1Password Business (stated 2026-09-04)."

# Two shapes: Teams Starter Pack is a flat $24.95 per month billed annually
# for 10 members with up to 10 extra seats at $4.99 each (20 max); Business
# is $8.99 per user per month billed annually. Figures come from the page's
# FAQ and description; the /pricing landing page itself shows only
# request-a-quote enterprise products.
tiers:
  - plan: Teams Starter Pack
    base_monthly_usd: 24.95
    per_seat_monthly_usd: 4.99
    included_seats: 10
    max_seats: 20
    seat_label: member
    billing: annual
    provenance:
      source_url: https://1password.com/pricing/business
      fetched_at: 2026-09-04
      method: live_fetch
      note: 'Browser-rendered fetch. FAQ: "Teams Starter Pack costs $24.95 per month when billed annually, or $299.40 per year, and includes 10 members. You can add up to 10 additional seats … USD: $4.99 per seat per month."'
  - plan: Business
    base_monthly_usd: 0
    per_seat_monthly_usd: 8.99
    seat_label: user
    billing: annual
    provenance:
      source_url: https://1password.com/pricing/business
      fetched_at: 2026-09-04
      method: live_fetch
      note: 'FAQ: "1Password Business costs $8.99 per user per month when billed annually, or $107.88 per user per year." SSO integrations and Watchtower included.'

clauses:
  - topic: billing_timing
    status: stated
    finding: >-
      1Password quotes annual billing only, payable by ACH debit from
      eligible US bank accounts or credit card, with volume and nonprofit
      discounts through sales and purchase via AWS Marketplace (2026-09-04).
    provenance:
      source_url: https://1password.com/pricing/business
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: cancellation
    status: not_stated
    finding: >-
      1Password's business pricing page states no cancellation or refund
      terms (2026-09-04).
    provenance:
      source_url: https://1password.com/pricing/business
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      1Password's business pricing page states no data-export terms
      (2026-09-04).
    provenance:
      source_url: https://1password.com/pricing/business
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: 1password-business-per-user-annual
    claim: >-
      On 2026-09-04 1Password listed Business at $8.99 per user per month
      billed annually, $107.88 per user per year, with a 14-day free trial.
    provenance:
      source_url: https://1password.com/pricing/business
      fetched_at: 2026-09-04
      method: live_fetch
  - id: 1password-teams-starter-pack
    claim: >-
      1Password's Teams Starter Pack is $24.95 per month billed annually
      ($299.40 a year) for 10 members, expandable to 20 at $4.99 per extra
      seat per month (2026-09-04).
    provenance:
      source_url: https://1password.com/pricing/business
      fetched_at: 2026-09-04
      method: live_fetch
  - id: 1password-pricing-page-quote-only
    claim: >-
      1password.com/pricing on 2026-09-04 opened on an Enterprise tab
      listing 5 request-a-quote products and no prices; the self-serve
      figures sit on the /pricing/business tab.
    provenance:
      source_url: https://1password.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: 1password-vs-bitwarden-ten-users
    claim: >-
      For 10 users 1Password's Teams Starter Pack costs $24.95 per month
      against $40 on Bitwarden Teams, while at 25 users 1Password Business
      is $224.75 against Bitwarden's $100 (2026-09-04).
    provenance:
      source_url: https://1password.com/pricing/business
      fetched_at: 2026-09-04
      method: live_fetch
  - id: 1password-payment-methods
    claim: >-
      1Password accepts ACH direct debit from eligible US bank accounts,
      credit cards and its own gift cards, and sells Business through AWS
      Marketplace (2026-09-04).
    provenance:
      source_url: https://1password.com/pricing/business
      fetched_at: 2026-09-04
      method: live_fetch
