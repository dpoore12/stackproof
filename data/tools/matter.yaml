slug: matter
vendor: Matter (MatterApp, Inc)
product: Matter
category: performance_management
url: https://www.matterapp.com/pricing
free_trial: "14-day free trial, no credit card required; unselected trials fall back to the free Free plan automatically (2026-09-04)."
pricing_note: "Matter is a Slack/Teams-native peer-recognition and survey product, included in this category for the same reason as Bonusly: recognition and engagement are bundled into the same buying decision as performance/OKR tools by Lattice and 15Five. Matter bills only members active in its connected Slack/Teams channel, not the whole workspace, and prorates daily. Listed prices are stated as \"billed annually\"; the page also shows a monthly-billing toggle (\"Yearly (Save 25%) / Monthly plans available\") whose exact monthly dollar figures were not captured by this static fetch."

