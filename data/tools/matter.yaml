      note: '"Pro. Most Popular. $3 USD per user/month, billed annually. Everything in Basic, and: Rewards (10,000+ eGift cards, premium gifts across 200+ countries), Company Swag (1,900+ items), Challenges and incentives."'
  - plan: Free
    compare: false
