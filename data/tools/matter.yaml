    base_monthly_usd: 0
    per_seat_monthly_usd: 1
    seat_label: channel member
    billing: annual
    provenance:
      source_url: https://www.matterapp.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Basic. $1 USD per user/month, billed annually. Everything in Free, and: Celebrations, Custom kudos (e.g., company values), Analytics and reporting."'
  - plan: Pro
