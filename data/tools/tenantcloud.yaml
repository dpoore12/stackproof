findings:
  - id: tenantcloud-unlimited-units-every-tier
    claim: >-
      TenantCloud's feature-comparison table lists "Unlimited" properties
      and units for all four of its plans (Starter, Growth, Pro,
      Business), so its price scales only by feature set, not portfolio
      size (2026-09-04).
    provenance:
      source_url: https://www.tenantcloud.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: tenantcloud-starter-price-inconsistency
    claim: >-
      TenantCloud's own pricing page prints two different undiscounted
      monthly prices for its Starter plan in two overlapping page
      fragments -- "$18/mo" in one and "$25/mo" in the other -- while
      both agree on the discounted annual rate of $15/mo (2026-09-04).
    provenance:
      source_url: https://www.tenantcloud.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
