pricing_note: "TenantCloud's feature-comparison table states \"Properties & Units: Unlimited\" identically across all four tiers -- price scales only with feature set, never with portfolio size. Starter's undiscounted monthly rate printed inconsistently across two overlapping page fragments ($18/mo vs $25/mo); the higher figure is recorded here per this project's rule to never publish an understated number, and the conflict is captured as a finding."

