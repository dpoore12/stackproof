clauses:
  - topic: cancellation
    status: stated
    finding: >-
      Pipedrive states there is no commitment and the plan can be changed at
      any time; annual plans are paid as one payment for the year
      (2026-09-03).
    quote: "No commitment – you can make changes anytime."
    provenance:
      source_url: https://www.pipedrive.com/en/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - topic: billing_timing
    status: stated
    finding: >-
      Monthly billing charges on the same day each month; annual billing is
      charged once for the whole year and is advertised as saving up to 42%
      (2026-09-03).
    provenance:
      source_url: https://www.pipedrive.com/en/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - topic: data_export
    status: needs_account
    finding: >-
      Data-export terms are not on Pipedrive's pricing page (2026-09-03);
      pending verification on an account.
    provenance:
      source_url: https://www.pipedrive.com/en/pricing
      fetched_at: 2026-09-03
      method: not_available

findings:
  - id: pipedrive-per-seat-prices-annual
    claim: >-
      On 2026-09-03 Pipedrive listed Lite at $14, Growth at $39, Premium at
      $59 and Ultimate at $79 per seat per month, each billed annually as one
      payment of $168, $468, $708 or $948 per seat per year.
    provenance:
      source_url: https://www.pipedrive.com/en/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - id: pipedrive-annual-discount-42
    claim: >-
      Pipedrive advertises annual billing as saving up to 42% versus monthly,
      which implies its monthly rates run well above the $14–$79 annual
      figures shown by default (2026-09-03).
    provenance:
      source_url: https://www.pipedrive.com/en/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - id: pipedrive-addons-stack
    claim: >-
      Pipedrive sells five add-ons priced "starting from" $13.33 (Campaigns),
      $16 (Projects), $32.50 (LeadBooster), $32.50 (Smart Docs) and $41 (Web
      Visitors) per month on top of any plan (2026-09-03).
    provenance:
      source_url: https://www.pipedrive.com/en/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - id: pipedrive-five-seat-cost
    claim: >-
      At Pipedrive's 2026-09-03 annual-billed rates a 5-seat team pays $70 per
      month on Lite, $195 on Growth, $295 on Premium or $395 on Ultimate.
    provenance:
      source_url: https://www.pipedrive.com/en/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - id: pipedrive-trial-no-card
    claim: >-
      Pipedrive's 14-day free trial requires no credit card and the plan can
      be changed at any time with no commitment (stated 2026-09-03).
    provenance:
      source_url: https://www.pipedrive.com/en/pricing
      fetched_at: 2026-09-03
      method: live_fetch
