pricing_note: "PerformYard prints only a per-person price RANGE, not a resolvable single number: both the Performance bundle (Reviews, Meetings, Goals, Engagement) and the Talent Development bundle (AI Coaching, Compensation, Competencies & Skills) are shown as \"$5-15 per person/month,\" driven by an interactive seat/product calculator whose specific output for any given seat count was not captured by this static fetch. Because the true price at any seat count is unknown within that range, this record uses the printed ceiling ($15) as a non-comparable upper-bound reference rather than guessing a point within the range."

