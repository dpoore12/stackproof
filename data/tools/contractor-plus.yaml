pricing_note: 'Contractor+ has a dedicated handyman landing page and was self-reportedly "Named Category Leader 2022 For Handyman Software Category." Its pricing page defaults to an annual-billed view ($29/mo PRO, $58/mo PRO TEAM) while its own meta description states the standing month-to-month rates ($49/mo PRO, $98/mo PRO TEAM); per this site''s standing convention, the annual rate is recorded as primary and the monthly rate as a compare:false secondary tier. FREEDOM is a free single-user plan with no team-size relevance and is excluded from the per-seat comparison (compare: false). MAX is effectively a custom/enterprise tier (its own page renders "$NaN/mo," a script bug indicating no fixed public price) and is excluded.'

