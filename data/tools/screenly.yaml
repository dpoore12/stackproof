pricing_note: 'Screenly bills Business and Enterprise for a minimum screen count even if fewer screens are active ("You are still billed for the plan''s minimum... a Business plan with 2 active screens is still billed for 5 screens"). Modeled here as a flat monthly floor (minimum screens x rate) plus the per-screen rate for each screen beyond that minimum -- mathematically identical to the vendor''s own per-screen billing above the floor.'

