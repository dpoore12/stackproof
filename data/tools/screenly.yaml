findings:
  - id: screenly-billable-screen-definition
    claim: >-
      Screenly defines a "billable screen" as any external display
      powered by a Screenly player, Screenly Anywhere instance, or app
      instance -- one player is required per screen (2026-09-04).
    provenance:
      source_url: https://www.screenly.io/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

clauses:
  - topic: cancellation
    status: stated
    quote: "You can cancel your plan at any time on the billing page inside your online Screenly account. Once you cancel, you will be able to use your account as normal until your plan expires. We will not bill you again after your cancellation."
    finding: >-
      Screenly allows self-service cancellation at any time, with access
      continuing through the end of the current billing period and no
      further charges afterward (2026-09-04).
    provenance:
      source_url: https://www.screenly.io/pricing/
