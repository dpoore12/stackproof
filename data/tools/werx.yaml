pricing_note: 'Werx''s three tiers differ only by active-project count, with every feature on every plan; team size is a separate flat per-user add-on ($6/mo standard, $4/mo time-only) layered on top of any tier. Each tier''s base price is read as including 1 user (Essential is explicitly "For solo contractors"), with the $6/mo standard-user rate applying to each additional seat. Werx has a dedicated handyman landing page (werxapp.com/industries/handyman/handyman-app/) explicitly marketing to handyman businesses.'

