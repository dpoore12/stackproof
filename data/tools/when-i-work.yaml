findings:
  - id: when-i-work-two-plan-structure
    claim: >-
      When I Work sells exactly two plans gated purely by location count,
      not features: $2.50/user/month for a single location and
      $5/user/month for multiple locations, with identical functionality
      otherwise (2026-09-04).
    provenance:
      source_url: https://wheniwork.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: when-i-work-rippling-payroll-offer
    claim: >-
      When I Work offers new customers six free months of Rippling
      payroll and HR software as a partner promotion (2026-09-04).
    provenance:
      source_url: https://wheniwork.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
