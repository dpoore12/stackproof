slug: google-workspace
vendor: Google
product: Google Workspace
category: productivity_suite
url: https://workspace.google.com/pricing
free_trial: "14-day free trial (stated 2026-09-04)."
pricing_note: "Per-user pricing with no base fee on a 1-year commitment, billed monthly; the flexible month-to-month prices did not render. A 20% (Plus: 50%) introductory discount for the first 3 months applies to new customers for the first 20 users and is recorded as a promo, with the standard price as the tier. Business plans are capped at 300 users."

tiers:
  - plan: Business Starter
    base_monthly_usd: 0
    per_seat_monthly_usd: 7
    max_seats: 300
    seat_label: user
    billing: annual
    promo: "20% off for the first 3 months (Sep 17 to Dec 17, 2026) for new customers, first 20 users: $5.60."
    provenance:
      source_url: https://workspace.google.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: 'Browser-rendered fetch on a US gateway, "Annual (Save 16% with 1 year commitment)" active. "Starter … $5.60 $7** / user per month"; price details "Dec 17, 2026 - Onwards … $7.00 … Price is per user/month and does not include tax". 30 GB pooled storage per user.'
  - plan: Business Standard
    base_monthly_usd: 0
    per_seat_monthly_usd: 14
    max_seats: 300
    seat_label: user
    billing: annual
    promo: "20% off for the first 3 months for new customers, first 20 users: $11.20."
    provenance:
      source_url: https://workspace.google.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Standard … $11.20 $14** / user per month"; "Dec 17, 2026 - Onwards … $14.00". 2 TB pooled storage per user; marked most popular in the compare table.'
  - plan: Business Plus
    base_monthly_usd: 0
    per_seat_monthly_usd: 22
    max_seats: 300
    seat_label: user
    billing: annual
    promo: "50% off for the first 3 months for new customers, first 20 users: $11."
    provenance:
