findings:
  - id: jobtread-graduated-user-pricing
    claim: >-
      JobTread's tiered price breaks for additional internal users are
      $20 each for users 2-10, $15 each for users 11-20, $10 each for
      users 21-30, and $5 each for user 31 and beyond on the monthly
      plan, with lower per-tier rates of $16/$12/$8/$4 on the annual plan
      (2026-09-04).
    provenance:
      source_url: https://www.jobtread.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: jobtread-free-external-users
    claim: >-
      JobTread does not charge for vendor, subcontractor, or customer
      portal users, which are free and unlimited, nor for certain field
      crew who only upload photos or check off tasks (2026-09-04).
    provenance:
      source_url: https://www.jobtread.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
