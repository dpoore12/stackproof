pricing_note: 'JobTread''s own FAQ lays out a genuinely graduated per-seat schedule ("tiered price breaks are only for the users in their respective tiers"): the first internal user is included in the $199/mo base, then users 2-10 cost $20 each, 11-20 cost $15 each, 21-30 cost $10 each, and 31+ cost $5 each (monthly billing; the annual plan''s per-tier rates are lower). This is marginal/graduated pricing, not a flat per-seat rate, so it cannot be represented by this schema''s base + flat-per-seat formula without either overstating or understating cost at higher seat counts; the $199 base is recorded as a compare:false starting figure and the full tier table is captured as a finding instead.'

