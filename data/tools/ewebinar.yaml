clauses:
  - topic: billing_timing
    status: stated
    quote: "We will never raise your pricing level without first giving you a chance to decide if that is what you want to do... If you decide to go ahead and publish the eWebinar, you will be charged immediately the difference in price between Levels 1 and 2 on a prorated basis for the time remaining in your current monthly or annual billing cycle."
    finding: >-
      eWebinar warns before an action that would raise the billing level,
      then charges the prorated difference immediately if the customer
      proceeds; downgrades only happen automatically at the end of the
      billing cycle (2026-09-04).
    provenance:
      source_url: https://www.ewebinar.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: cancellation
    status: stated
    quote: "If you cancel before your 14-day trial ends, you will not be charged at all. If you cancel after your trial ends, your subscription will expire at the end of your monthly or annual subscription term."
    finding: >-
      eWebinar lets a customer cancel at any time, but a cancellation
      made after the trial only takes effect at the end of the current
      billing term, not immediately (2026-09-04).
    provenance:
      source_url: https://www.ewebinar.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: stated
    quote: "We do not offer refunds. This includes payments for our base subscription, subscription upgrades, subscription add-ons, and additional active eWebinars (at Level 3)."
    finding: >-
      eWebinar states it offers no refunds of any kind, on any charge
      type, at any level (2026-09-04).
    provenance:
      source_url: https://www.ewebinar.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      eWebinar's pricing page and FAQ state no data-export terms
      (2026-09-04).
    provenance:
      source_url: https://www.ewebinar.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: ewebinar-no-free-plan-despite-trial
    claim: >-
      eWebinar's FAQ states "we have a free trial but we do not have a
      free plan": an account with zero active webinars is still billed
      at Level 1 upon renewal unless the customer cancels (2026-09-04).
    provenance:
      source_url: https://www.ewebinar.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: ewebinar-self-adjusting-tiers
    claim: >-
      eWebinar's subscription level is set solely by the count of
      published ("active") webinars regardless of their traffic: its FAQ
      states a single active webinar with "hundreds of people" attending
      monthly across many sessions "still only counts as one active
      eWebinar" (2026-09-04).
    provenance:
      source_url: https://www.ewebinar.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: ewebinar-unlimited-team-members
    claim: >-
      Every eWebinar tier includes unlimited team members and unlimited
      recurring sessions at no extra cost; only the count of active
      published webinars and the monthly registrant cap change price
      (2026-09-04).
    provenance:
      source_url: https://www.ewebinar.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
