pricing_note: 'Satori prices by active-client cap per tier rather than by number of coaches. The pricing page''s billing-period toggle defaults to "Annual" (marked with the "current" CSS class in the page''s own server-rendered markup, alongside a visible "Get 2 Months Free" annual promo banner), so the captured $33/$49/$124 per-month figures are recorded as the annual rate; the toggle''s "Monthly" figures are rendered client-side via Alpine.js and were not present in captured static text, so no separate monthly rate is recorded for this vendor.'

