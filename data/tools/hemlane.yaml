findings:
  - id: hemlane-no-per-user-fees
    claim: >-
      Hemlane's FAQ states, "Are there per-user fees? No, the prices
      above include unlimited users" -- price scales only by rental unit
      count, never by staff headcount (2026-09-04).
    provenance:
      source_url: https://www.hemlane.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

clauses:
  - topic: cancellation
    status: stated
    quote: "You can change your subscription at any time without penalty. In the case of a cancellation, your subscription will remain active until the end of the period (month or annual)."
    finding: >-
      Hemlane allows cancellation at any time without penalty, with
      access continuing through the end of the current billing period
      (2026-09-04).
    provenance:
      source_url: https://www.hemlane.com/pricing/
