clauses:
  - topic: billing_timing
    status: stated
    finding: >-
      Harvest charges a prorated amount for seats added mid-cycle, does not
      allow seat removal until the cycle ends, and offers ACH or bank
      transfer invoicing only for 10 or more seats paid yearly (2026-09-04).
    quote: "While you can’t remove seats during your current billing cycle, you can indicate inside your account if you’d like your yearly or monthly plan to renew with fewer seats."
    provenance:
      source_url: https://www.getharvest.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_retention
    status: stated
    finding: >-
      Harvest deactivates an unconverted trial after 30 days but keeps the
      data for a later return (2026-09-04).
    quote: "Even though your trial account will be deactivated, we won’t delete your data."
    provenance:
      source_url: https://www.getharvest.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: cancellation
    status: stated
    finding: >-
      Harvest lets an admin change plans at any time, with upgrades
      immediate and downgrades scheduled for the next cycle; the FAQ gives
      no terms for full cancellation or refunds (2026-09-04).
    quote: "you can choose to either immediately upgrade to the premium plan, or schedule a downgrade to the pro plan"
    provenance:
      source_url: https://www.getharvest.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      Harvest's pricing page states no data-export terms (2026-09-04).
    provenance:
      source_url: https://www.getharvest.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: harvest-usage-based-extras
    claim: >-
      Harvest's Teams and Enterprise cards say the seat rate covers core
      features and that additional invoices, projects, clients and tasks
      are billed on usage, without stating the included allowance or the
      overage price on the pricing page (2026-09-04).
    provenance:
      source_url: https://www.getharvest.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: harvest-annual-discount
    claim: >-
      Harvest's annual prepay saves 20%: Teams drops from $11 to $9 per seat
      a month ($108 a year) and Enterprise from $17.50 to $14 ($168 a year)
      (2026-09-04).
    provenance:
      source_url: https://www.getharvest.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: harvest-free-plan-limits
    claim: >-
      Harvest's Free plan allows 1 seat and 2 projects; the FAQ says a
      trial account can switch to it only while it meets those requirements
      (2026-09-04).
    provenance:
      source_url: https://www.getharvest.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: harvest-plan-name-drift
    claim: >-
      Harvest's plan cards are named Teams and Enterprise but its FAQ still
      refers to upgrading to "the premium plan" and downgrading to "the pro
      plan", 2 names that no longer appear on the cards (2026-09-04).
    provenance:
      source_url: https://www.getharvest.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
