pricing_note: 'Trainerize prices Basic, Pro 5, Grow, and Studio Plus by a client-count selector, but only the currently-selected step''s price is rendered as static page text (client-side JS swaps the displayed dollar figure on selection); the fuller schedules behind each selector (Basic: 2/5/15 clients; Pro 5: 5/15/30/50/75/100/200 clients) were not captured as static text. Only the lowest confirmed starting figures are recorded here, both as `compare: false`, so this vendor is never ranked "cheapest" in the category table on data this site could not fully verify. Grow and Studio Plus base prices could not be isolated from the page''s add-on price noise and are not recorded at all.'

