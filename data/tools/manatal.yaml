clauses:
  - topic: cancellation
    status: not_stated
    finding: >-
      Manatal's pricing page states no cancellation or refund terms beyond a
      14-day trial "with no commitment" (2026-09-04).
    provenance:
      source_url: https://www.manatal.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: stated
    finding: >-
      Manatal lists the ability to modify, extract and permanently delete
      candidate data on request under its GDPR, CCPA and PDPA compliance
      features on all plans, without a post-cancellation export window
      (2026-09-04).
    quote: "Modify, extract and permanently delete data when requested by candidates"
    provenance:
      source_url: https://www.manatal.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    finding: >-
      Manatal adds GST for Singaporean tax residents; yearly billing saves
      $4 per user a month on every plan (2026-09-04).
    quote: "Additional GST will be applied to Singaporean tax residents"
    provenance:
      source_url: https://www.manatal.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: manatal-per-recruiter-pricing
    claim: >-
      Manatal charges per recruiter user ($15, $35 or $55 a month on yearly
      billing) with unlimited free hiring-manager seats, so a company's
      employee count does not affect the price (2026-09-04).
    provenance:
      source_url: https://www.manatal.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: manatal-flat-annual-discount
    claim: >-
      Manatal's yearly billing is exactly $4 per user a month cheaper than
      monthly on every plan ($15 vs $19, $35 vs $39, $55 vs $59), a 7% to
      21% discount depending on the plan (2026-09-04).
    provenance:
      source_url: https://www.manatal.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: manatal-professional-caps
    claim: >-
      Manatal's Professional plan caps an account at 15 jobs and 10,000
      candidates; Enterprise removes both caps for $20 more per user a month
      (2026-09-04).
    provenance:
      source_url: https://www.manatal.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
