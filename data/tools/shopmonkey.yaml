pricing_note: 'Shopmonkey''s three priced tiers (Basic, Clever, Genius) differentiate by feature bundle, not by a stated seat/user count — no per-tier user cap appears in the tier cards or feature lists. Its own tagline says it powers "everything from single-bay shops to 100+ location franchises," and its FAQ list includes "How many users can our shop have on Shopmonkey?" but that answer sits behind a collapsed accordion panel not present in this fetch''s static page text, so no digit is recorded. Multi-Shop is fully quote-gated ("Custom," "Contact us for pricing") and is not recorded as a tier.'

