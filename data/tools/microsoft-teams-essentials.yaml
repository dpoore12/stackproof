clauses:
  - topic: auto_renew
    status: stated
    finding: >-
      Teams Essentials is sold as an annual subscription that auto-renews,
      paid yearly (2026-09-04).
    quote: "Annual subscription—auto renews"
    provenance:
      source_url: https://www.microsoft.com/en-us/microsoft-teams/compare-microsoft-teams-business-options
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: cancellation
    status: stated
    finding: >-
      Microsoft says an upgraded Teams account cannot revert to the free
      version under the same email address, and all users in the
      organization must be upgraded together (2026-09-04).
    quote: "once you upgrade and convert from a free account to a paid account, you can’t revert to the free version using the same email address"
    provenance:
      source_url: https://www.microsoft.com/en-us/microsoft-teams/compare-microsoft-teams-business-options
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      The Teams business comparison page states no data-export terms
      (2026-09-04).
    provenance:
      source_url: https://www.microsoft.com/en-us/microsoft-teams/compare-microsoft-teams-business-options
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: teams-essentials-price-and-limits
    claim: >-
      Microsoft Teams Essentials costs $4 per user a month on an annual
      commitment and allows 30-hour meetings with 300 participants and 10 GB
      of cloud storage per user (2026-09-04).
    provenance:
      source_url: https://www.microsoft.com/en-us/microsoft-teams/compare-microsoft-teams-business-options
      fetched_at: 2026-09-04
      method: live_fetch
  - id: teams-no-return-to-free
    claim: >-
      Microsoft blocks a return to free Teams after upgrading under the same
      email and requires 100% of an organization's users to be on the paid
      plan (2026-09-04).
    provenance:
      source_url: https://www.microsoft.com/en-us/microsoft-teams/compare-microsoft-teams-business-options
      fetched_at: 2026-09-04
      method: live_fetch
  - id: teams-premium-addon-price
    claim: >-
      Microsoft Teams Premium is listed at $10 per user a month paid yearly
      as an add-on tier, 2.5 times the Essentials price (2026-09-04).
    provenance:
      source_url: https://www.microsoft.com/en-us/microsoft-teams/compare-microsoft-teams-business-options
      fetched_at: 2026-09-04
      method: live_fetch
