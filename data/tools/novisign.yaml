      note: '"Premium -- For organizations -- $25 screen/mo," "Minimum of 20 screens required" -- modeled as a $500/month floor (20 x $25) plus $25 for each screen beyond 20. Unlimited users, adds admin management, SSO, API over Business Plus.'

findings:
  - id: novisign-refund-policy
    claim: >-
      NoviSign offers a prorated refund on an annual subscription
      cancelled "within the last 30-days," processed automatically from
      the account's Admin section (2026-09-04).
    provenance:
      source_url: https://www.novisign.com/pricing-usca/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: novisign-partners-quote-gated
    claim: >-
      NoviSign's "Partners" plan, a white-label reseller program, is
      fully quote-gated -- "Сall us" -- with no dollar figure published
      (2026-09-04).
    provenance:
      source_url: https://www.novisign.com/pricing-usca/
      fetched_at: 2026-09-04
      method: live_fetch

clauses:
  - topic: refund
    status: stated
    quote: "If you've paid for a yearly subscription in the last 30-days, and need to cancel your account, you are entitled to a prorated refund. We will automatically refund you the remaining balance from your original purchase."
    finding: >-
      NoviSign automatically issues a prorated refund on annual
      subscriptions cancelled within 30 days of payment (2026-09-04).
    provenance:
