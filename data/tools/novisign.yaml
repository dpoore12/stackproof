pricing_note: 'NoviSign''s billing-cycle toggle defaults to "Annualy (Save 10%)" and only the annual per-screen figures render statically -- no separate monthly number is captured, so all three tiers below are recorded as billing: annual. "Pricing is based on volumes of up to 50 players. Please contact us to obtain pricing if you require more than 50 players," so each self-serve tier is capped at 50 screens.'

