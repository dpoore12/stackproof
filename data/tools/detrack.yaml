findings:
  - id: detrack-annual-discount-uncaptured
    claim: >-
      Detrack's pricing page offers an annual-billing toggle labeled
      "SAVE 10%," but the resulting annual per-driver dollar figures
      were only present in the page's default view state, not
      statically as text, as of 2026-09-05.
    provenance:
      source_url: https://www.detrack.com/pricing/
      fetched_at: 2026-09-05
      method: live_fetch
  - id: detrack-unlimited-office-seats
    claim: >-
      Detrack does not charge for office, dispatcher, or admin seats
      at any tier — "unlimited sub-users" are included free, and only
      active drivers count toward the bill, per its pricing page as
      of 2026-09-05.
    provenance:
      source_url: https://www.detrack.com/pricing/
      fetched_at: 2026-09-05
      method: live_fetch
