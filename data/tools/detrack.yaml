pricing_note: >-
  Detrack's own headline is "Pay per driver. Not per user." — office
  and dispatcher seats are unlimited and free; only active drivers are
  billed. The page offers a 10%-off annual-billing toggle, but the
  resulting annual dollar figures were not present as static text in
  this fetch, so only monthly billing is recorded here (see finding).

