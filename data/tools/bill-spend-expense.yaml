product: BILL Spend & Expense
category: expense_management
url: https://www.bill.com/product/pricing
free_trial: "BILL Spend & Expense itself has no trial to expire: it is permanently free of subscription and per-user fees (stated 2026-09-04)."
pricing_note: "BILL Spend & Expense carries no subscription or per-user software fee at all; BILL monetizes it through card interchange and its credit-line product instead. The same company's Accounts Payable and Accounts Receivable (AP & AR) product is a separate, paid per-user subscription (Essentials $49, Team $65, Corporate $89 per user/month, Enterprise custom) that many customers layer alongside the free Spend & Expense product; those figures are recorded here as findings for bundling context, not as tiers of this record, since they belong to a distinct AP/AR product line."

