findings:
  - id: bill-spend-expense-free-model
    claim: >-
      BILL states "BILL Spend & Expense is free from subscription and
      per-user software fees," with revenue instead coming from card
      interchange and access to credit lines from $1,000 to $5M
      (not guaranteed, subject to application approval) (2026-09-04).
    provenance:
      source_url: https://www.bill.com/product/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: bill-ap-ar-price-ladder
    claim: >-
      BILL's separate Accounts Payable and Accounts Receivable product
      prices Essentials at $49, Team at $65 and Corporate at $89 per user
      a month for direct customers, with Enterprise at custom pricing, and
      Corporate/Enterprise plans offer lower-cost approver-only seats
      alongside standard seats (2026-09-04).
    provenance:
      source_url: https://www.bill.com/product/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: bill-per-transaction-fees
    claim: >-
      BILL states that beyond any subscription fee, "some payment types
      (like checks, ACH, instant transfers, or international payments)
      also have per-transaction fees, regardless of plan" (2026-09-04).
    provenance:
      source_url: https://www.bill.com/product/pricing
      fetched_at: 2026-09-04
      method: live_fetch
