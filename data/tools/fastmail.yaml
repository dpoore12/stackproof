clauses:
  - topic: refund
    status: stated
    finding: >-
      Fastmail gives no refunds for unused subscription time and points
      customers to the free trial instead (2026-09-04).
    quote: "we do not offer refunds for unused subscriptions, so please use your free trial to make sure Fastmail is right for you"
    provenance:
      source_url: https://www.fastmail.com/pricing/us/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: cancellation
    status: stated
    finding: >-
      Fastmail has no long-term contract; an account can be cancelled at
      any time with no further payments (2026-09-04).
    quote: "No, you can cancel your account at any time and there will be no further payments required."
    provenance:
      source_url: https://www.fastmail.com/pricing/us/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    finding: >-
      Fastmail applies plan changes instantly with a pro-rata credit for the
      old plan's remaining time, and takes cards, PayPal, Apple Pay and
      Google Pay but no bank transfers (2026-09-04).
    quote: "A pro-rata credit for the remaining time of your previous plan will be deducted from the cost of your new plan."
    provenance:
      source_url: https://www.fastmail.com/pricing/us/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      Fastmail's pricing page states no data-export terms; it describes
      inbound migration tools only (2026-09-04).
    provenance:
      source_url: https://www.fastmail.com/pricing/us/
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: fastmail-prepay-ladder
    claim: >-
      Fastmail's Standard business plan costs $6 per user a month on a
      1-month term, $5 on 12 months, $4.75 on 24 months and $4.67 on 36
      months, so the longest prepay saves 22% (2026-09-04).
    provenance:
      source_url: https://www.fastmail.com/pricing/us/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: fastmail-no-refunds
    claim: >-
      Fastmail's FAQ states no refunds for unused subscriptions, which on a
      36-month Professional prepay of $302.40 per user makes the trial the
      only exit (2026-09-04).
    provenance:
      source_url: https://www.fastmail.com/pricing/us/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: fastmail-storage-tiers
    claim: >-
      Fastmail business plans give 6 GB, 60 GB and 150 GB per user on Basic,
      Standard and Professional, with add-on storage available up to 300 GB
      per user (2026-09-04).
    provenance:
      source_url: https://www.fastmail.com/pricing/us/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: fastmail-geo-path
    claim: >-
      Fastmail redirected a German gateway from /pricing/ to /pricing/de/ in
      euros on 2026-09-04, while the explicit /pricing/us/ path rendered USD
      on the same gateway.
    provenance:
      source_url: https://www.fastmail.com/pricing/us/
      fetched_at: 2026-09-04
      method: live_fetch
