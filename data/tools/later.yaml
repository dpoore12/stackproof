      note: '"Extra Social Sets ($11.25 USD/month each)" on the yearly toggle.'
  - name: Extra AI credits
    amount_usd: 3.75
    unit: per 100 credits per month, yearly billing
    applies_to: Growth and Scale
    provenance:
