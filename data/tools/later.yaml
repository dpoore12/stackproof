      method: live_fetch
      note: '"Extra AI credits ($3.75 USD/month for 100 credits/month)".'

clauses:
  - topic: auto_renew
    status: stated
    finding: >-
      Later bills annual plans once a year and renews them automatically
      (2026-09-04).
    quote: "Annual plans are billed once per year and renewed automatically."
    provenance:
      source_url: https://later.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: cancellation
    status: not_stated
    finding: >-
      Later's pricing page states no cancellation or refund terms
      (2026-09-04).
    provenance:
      source_url: https://later.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      Later's pricing page states no data-export terms; analytics history is
      capped at 3 months, 1 year and 2 years by plan (2026-09-04).
    provenance:
      source_url: https://later.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: later-extra-user-price-mismatch
    claim: >-
      Later's Growth and Scale cards price extra users at $3.75 a month on
      yearly billing while the FAQ on the same page says $5 per additional
      user, a 25% gap that matches the annual discount (2026-09-04).
    provenance:
      source_url: https://later.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: later-post-caps
    claim: >-
      Later caps scheduled posts at 30 per profile a month on Starter and
      180 on Growth, with Scale unlimited, and AI credits at 5, 50 and 100
      a month (2026-09-04).
    provenance:
      source_url: https://later.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: later-social-set-definition
    claim: >-
      A Later Social Set is 1 profile on each of 8 networks, so Starter's 1
      set covers 8 profiles, Growth's 2 cover 16 and Scale's 6 cover 48;
      extra sets cost $11.25 a month on yearly billing (2026-09-04).
    provenance:
      source_url: https://later.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: later-nonprofit-discount
    claim: >-
      Later gives qualified non-profits 50% off the annual Growth plan only
      (2026-09-04).
    provenance:
      source_url: https://later.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
