slug: ringcentral
vendor: RingCentral
product: RingEX
category: business_phone
url: https://www.ringcentral.com/office/plansandpricing.html
free_trial: "A free trial is offered (\"Try free\" on each plan and an FAQ on its length); the length was not captured (2026-09-03)."

# Per user per month "paid annually". Each card also prints a higher figure
# ($30, $35, $45) which the page presents as the month-to-month price. The
# page's user-count selector and its "Important details and disclaimers"
# section were not captured, so volume-band effects on these prices are
# unverified.
tiers:
  - plan: Core
    base_monthly_usd: 0
    per_seat_monthly_usd: 20
    seat_label: user
    billing: annual
    provenance:
      source_url: https://www.ringcentral.com/office/plansandpricing.html
      fetched_at: 2026-09-03
      method: live_fetch
      note: 'Browser-rendered fetch. Card: "$20 … $30 /user/month * paid annually"; page h3 headings list $20, $25, $35. Unlimited domestic calling, 100 toll-free minutes, 25 SMS per user per month.'
  - plan: Core (monthly billing)
    compare: false
    base_monthly_usd: 0
    per_seat_monthly_usd: 30
    seat_label: user
    billing: monthly
    provenance:
      source_url: https://www.ringcentral.com/office/plansandpricing.html
      fetched_at: 2026-09-03
      method: live_fetch
      note: 'The second figure on the Core card; the Monthly/Annually switcher state could not be read.'
  - plan: Advanced
    base_monthly_usd: 0
    per_seat_monthly_usd: 25
    seat_label: user
    billing: annual
    provenance:
      source_url: https://www.ringcentral.com/office/plansandpricing.html
      fetched_at: 2026-09-03
      method: live_fetch
      note: '"$25 … $35 /user/month * paid annually". Marked Most popular. CRM integrations, 1,000 toll-free minutes, 100 SMS per user per month.'
  - plan: Ultra
    base_monthly_usd: 0
    per_seat_monthly_usd: 35
    seat_label: user
    billing: annual
    provenance:
      source_url: https://www.ringcentral.com/office/plansandpricing.html
      fetched_at: 2026-09-03
      method: live_fetch
      note: '"$35 … $45 /user/month * paid annually". 10,000 toll-free minutes, 200 SMS per user per month, webinar, unlimited storage.'

clauses:
  - topic: billing_timing
    status: stated
    finding: >-
      RingEX's displayed prices of $20, $25 and $35 per user per month are
      "paid annually"; the cards show $30, $35 and $45 alongside them for
      monthly billing (2026-09-03).
    provenance:
      source_url: https://www.ringcentral.com/office/plansandpricing.html
      fetched_at: 2026-09-03
      method: live_fetch
  - topic: cancellation
    status: not_stated
    finding: >-
      RingEX's pricing cards state no cancellation or refund terms; the
      page's disclaimers section was not captured (2026-09-03).
    provenance:
      source_url: https://www.ringcentral.com/office/plansandpricing.html
      fetched_at: 2026-09-03
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      RingEX's pricing page states no data-export or number-porting-out
      terms in the captured section (2026-09-03).
    provenance:
      source_url: https://www.ringcentral.com/office/plansandpricing.html
      fetched_at: 2026-09-03
      method: live_fetch

findings:
  - id: ringcentral-ringex-prices-annual
    claim: >-
      On 2026-09-03 RingCentral listed RingEX Core at $20, Advanced at $25
      and Ultra at $35 per user per month paid annually, with $30, $35 and
      $45 shown as the monthly-billing figures.
    provenance:
      source_url: https://www.ringcentral.com/office/plansandpricing.html
      fetched_at: 2026-09-03
      method: live_fetch
  - id: ringcentral-sms-and-tollfree-allowances
    claim: >-
      RingEX includes 25, 100 or 200 SMS per user per month and 100, 1,000
      or 10,000 toll-free minutes on Core, Advanced and Ultra respectively
      (2026-09-03).
    provenance:
      source_url: https://www.ringcentral.com/office/plansandpricing.html
      fetched_at: 2026-09-03
      method: live_fetch
  - id: ringcentral-ai-receptionist-addon
    claim: >-
      RingCentral's AI Receptionist is an add-on on all 3 RingEX plans
      rather than included, while captions, transcriptions and AI notes are
      included from Core up (2026-09-03).
    provenance:
      source_url: https://www.ringcentral.com/office/plansandpricing.html
      fetched_at: 2026-09-03
      method: live_fetch
  - id: ringcentral-monthly-premium
    claim: >-
      RingEX's monthly-billing figures of $30, $35 and $45 run $10 per user
      per month above the annual prices, a 29% to 50% premium for not
      committing to a year (2026-09-03).
    provenance:
      source_url: https://www.ringcentral.com/office/plansandpricing.html
      fetched_at: 2026-09-03
      method: live_fetch
  - id: ringcentral-five-user-cost
    claim: >-
      At RingEX's 2026-09-03 annual rates a 5-user team pays $100 per month
      on Core, $125 on Advanced or $175 on Ultra, against $75 on Quo Starter
      for the same 5 users.
    provenance:
      source_url: https://www.ringcentral.com/office/plansandpricing.html
      fetched_at: 2026-09-03
      method: live_fetch
