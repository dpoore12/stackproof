pricing_note: 'Basic and Starter each state an explicit property-count cap on the pricing card ("only available for 1 property or less" / "2 properties or less"), recorded as `max_seats`. Professional and Ultimate publish no property-count cap or per-extra-property rate anywhere in the static text, so their prices are recorded compare: false as starting figures rather than assumed unlimited. Regular annual prices are recorded as primary tiers; monthly prices are `compare: false` secondary tiers, per this site''s standing convention.'

