findings:
  - id: expensify-eur-not-usd
    claim: >-
      Expensify's pricing page rendered EUR figures on repeated fetches
      from a German network gateway (Collect at 5 EUR per member a month,
      Control "as low as" 8 EUR per active member a month), so a US-dollar
      list price was not machine-recorded on 2026-09-04.
    provenance:
      source_url: https://www.expensify.com/pricing
      fetched_at: 2026-09-04
      method: not_available
  - id: expensify-card-discount
    claim: >-
      Expensify states using the Expensify Card can "save up to 50% on
      Expensify," tying software cost to card spend rather than pricing
      the software independently of payment method (2026-09-04).
    provenance:
      source_url: https://www.expensify.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: expensify-account-manager-threshold
    claim: >-
      Expensify's Control plan compare table marks a dedicated account
      manager as "available on accounts of 100+ members," gating personal
      support behind a headcount threshold rather than plan tier alone
      (2026-09-04).
    provenance:
      source_url: https://www.expensify.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
