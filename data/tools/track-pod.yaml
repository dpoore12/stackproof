pricing_note: >-
  All three tiers require a minimum of 3 drivers ("*min 3 drivers").
  Modeled here as a fixed 3-driver base cost (included_seats: 3) plus
  the same per-driver rate for each driver beyond that, since the
  schema has no separate "minimum seats" concept — this correctly
  produces the real minimum monthly spend at any team size from 1 to 3
  drivers, and the true marginal cost beyond it.

