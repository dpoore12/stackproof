pricing_note: 'Elromco is a flat monthly fee per plan capped by office-user count (crew members, who do not need office seats, are unlimited on both plans). No setup fees. Elromco states annual billing can save "up to 15%" but does not publish a fixed annual rate, so only the standing monthly price is recorded.'

