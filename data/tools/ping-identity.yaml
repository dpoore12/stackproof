category: identity_sso
url: https://www.pingidentity.com/en/platform/pricing.html
free_trial: "\"Try PingOne for Workforce for Free\" offered on the pricing page (stated 2026-09-04)."
pricing_note: "Per-user pricing for PingOne for Workforce; the page also sells PingOne for Customers (CIAM), which is priced separately by annual flat fee (e.g. a $50k/year starting figure seen for one CIAM add-on) rather than per user, and is not covered by this record since it targets external customers rather than employees. Both priced Workforce tiers carry an asterisk on the page; the footnote text was not located in the rendered page, so any minimum term or seat count behind it is not machine-recorded."

