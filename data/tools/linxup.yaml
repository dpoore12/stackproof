pricing_note: 'Linxup sells separate product lines rather than tiers of one plan; a "No Contract / 2-year Contract / 3-year Contract" toggle defaults to "No Contract," the only price captured statically. Only the Vehicles tracking line prices this category''s "vehicle" axis -- ELD, AI Dash Cams, and Rear View Cams are add-ons priced on top of a vehicle tracker, and Asset tracking prices a different unit (equipment, not vehicles), so those four are recorded as standalone: false / compare: false rather than as a second comparable tier.'

