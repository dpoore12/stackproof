findings:
  - id: zoho-expense-active-user-overage
    claim: >-
      Zoho Expense's FAQ gives a worked example: buying 10 active-user
      licenses on the Premium annual plan but having 15 active users in a
      given month bills the extra 5 users at the monthly rate, "5 * 6 =
      $30" for that month, on top of the annual subscription (2026-09-04).
    provenance:
      source_url: https://www.zoho.com/us/expense/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: zoho-expense-addon-costs
    claim: >-
      Zoho Expense sells self-booking travel at $9.99 per trip, and
      optional Premium Support starting from $490 a year or a Jumpstart
      onboarding package starting from $500, on top of its per-user plan
      price (2026-09-04).
    provenance:
      source_url: https://www.zoho.com/us/expense/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: zoho-expense-receipt-scan-limits
    claim: >-
      Zoho Expense caps AI-powered receipt scanning by plan: 20 scans per
      user a month on Free/Trial, 200 on Standard, and 1,000 on Premium;
      beyond the limit, expenses can still be entered manually
      (2026-09-04).
    provenance:
      source_url: https://www.zoho.com/us/expense/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
