free_trial: "14-day free trial, no credit card required (stated 2026-09-04)."
pricing_note: "The US pricing page geo-redirects to a German-language, EUR-priced locale by default; appending ?sredirect=false to the URL served the US/English page in USD, the same fix used for this dataset's Zoho Workplace record. Free plan caps at 3 users; Standard and Premium bill only 'active' users (those who create an expense or report), and additional active users beyond purchased licenses are billed at the plan's monthly per-user rate as an overage for that month."

