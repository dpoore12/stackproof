findings:
  - id: vagaro-bookable-calendar-definition
    claim: >-
      Vagaro defines a "bookable calendar" as an individual performing
      services who requires their own scheduling, explicitly excluding
      admin/front-desk staff from the seat count, per its own pricing
      page as of 2026-09-04.
