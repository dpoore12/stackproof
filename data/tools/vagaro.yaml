pricing_note: 'Vagaro is a multi-vertical booking/business-management platform for salons, spas, and fitness businesses generally — not medspa-specific — but it explicitly serves med spas as one of its named business types. Pricing scales by "bookable calendar" count via an interactive selector (1 / 2 / 3 / 4 / 5 / 6 / 7+); only the default 1-seat ("Just Me") standing rate rendered as static text, so only that step is recorded. The page''s headline "$23.99/mo" is a time-limited 6-month promotional rate; the struck-through $30.00/mo standing rate is recorded instead, per this site''s policy against publishing promotional prices as the standing rate.'

