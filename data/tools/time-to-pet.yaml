pricing_note: 'Time To Pet sells two distinct pricing paths on the same platform: "Team" is a genuine base-plus-per-staff formula (worked example on the page, "$120/month for 5 staff," confirms $40 + $16 x 5 = $120, charged from the first staff member with no included seats) aimed at in-home pet sitting/dog walking; "Facility" is a flat $79/month fee for daycare/boarding operations with no stated staff cap or per-seat rate anywhere on the page. Both are recorded as real, purchasable plans for this category''s buyers rather than picking one; a business large enough that Facility beats Team''s per-seat cost would simply buy Facility. Solo/Lite (single-operator plans) and the >25-staff/bundle tiers are quote-gated or out of scope and excluded.'

