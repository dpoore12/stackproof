findings:
  - id: arboristdesk-price-lock
    claim: >-
      ArboristDesk states a "12-MONTH PRICE LOCK": the rate a customer
      signs at holds for at least a year, and if list prices change,
      existing customers keep their rate for 12 months from that day,
      per its pricing page as of 2026-09-05.
    provenance:
      source_url: https://arboristdesk.com/pricing/
      fetched_at: 2026-09-05
      method: live_fetch
  - id: arboristdesk-per-seat-add-on
    claim: >-
      ArboristDesk publishes a flat per-additional-user add-on price
      on every tier — $12/mo (Starter), $15/mo (Growth), $18/mo (Pro)
      — on top of each plan's included single seat, per its pricing
      page as of 2026-09-05.
    provenance:
      source_url: https://arboristdesk.com/pricing/
      fetched_at: 2026-09-05
      method: live_fetch
