slug: zoom-webinars
vendor: Zoom
product: Zoom Webinars, Webinars Plus & Events
category: webinar_platforms
url: https://zoom.us/pricing/events
free_trial: "No free trial found on this page; each tier's CTA is 'Buy Now'."
pricing_note: "Every tier requires an existing Zoom Workplace Pro subscription as a prerequisite (see this dataset's zoom.yaml record in the video_conferencing category, $14.16/user/month annual), so the figures below understate the real floor cost by that amount. Prices were sampled at the page's own default attendee-count selector (500); the page also lets a buyer choose other attendee-count tiers (up to 100,000) at different prices not captured here. Because only one attendee-count point was sampled and a base Workplace Pro plan is required underneath it, these tiers are marked non-comparable (compare: false) rather than risk a misleading cross-vendor number at other attendee counts."

tiers:
  - plan: Webinars
    compare: false
    standalone: false
    base_monthly_usd: 83.33
    per_seat_monthly_usd: 0
    max_seats: 500
    seat_label: attendee (sampled at the page's 500-attendee default)
    billing: annual
