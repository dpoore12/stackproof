findings:
  - id: zoom-webinars-requires-workplace-pro
    claim: >-
      Zoom's Webinars, Webinars Plus and Events add-ons each carry a "*
      Zoom Workplace Pro Required" footnote, so a buyer without an
      existing $14.16/user/month Pro subscription pays that on top of the
      $83.33-$415.83 add-on price to actually use any of them
      (2026-09-04).
    provenance:
      source_url: https://zoom.us/pricing/events
      fetched_at: 2026-09-04
      method: live_fetch
  - id: zoom-webinars-price-ladder
    claim: >-
      At the same 500-attendee capacity, Zoom prices Webinars at $83.33,
      Webinars Plus at $290.83 and Events at $415.83 per month billed
      annually, so Events costs exactly 5x the base Webinars tier
      (2026-09-04).
    provenance:
      source_url: https://zoom.us/pricing/events
      fetched_at: 2026-09-04
      method: live_fetch
  - id: zoom-webinars-shared-limits
    claim: >-
      All three tiers share the same event duration (30 hours) and video
      panelist limit (up to 1,000), scaling only in production and
      engagement features, not in these base capacity limits
      (2026-09-04).
    provenance:
      source_url: https://zoom.us/pricing/events
      fetched_at: 2026-09-04
      method: live_fetch
