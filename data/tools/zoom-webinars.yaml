      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Webinars Plus. Access both our standard and modern webinar platforms with AI, on-demand video, and pro production tools. Attendees: 500. Annual subscription. $290.83 per month, billed annually. * Zoom Workplace Pro Required." Pre-recorded content run live, private backstage, pro layouts/scenes, AI event pages, richer analytics.'
  - plan: Events
    compare: false
    standalone: false
    base_monthly_usd: 415.83
    per_seat_monthly_usd: 0
    max_seats: 500
