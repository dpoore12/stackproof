      note: '"Webinars. Run reliable, high-quality broadcasts on our standard webinar platform. Attendees: 500. Annual subscription. SAVE 35%. $83.33 per month, billed annually. * Zoom Workplace Pro Required." 30-hour event duration, up to 1,000 video panelists, up to 100,000 attendees at higher selector values.'
