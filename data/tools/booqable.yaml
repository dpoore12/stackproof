pricing_note: 'Booqable prices Start/Grow/Scale as whole-plan jumps, not a per-seat add-on: Grow''s own copy states "5 extra users + permissions" over Start, and Scale states "10 extra users + permissions" over Grow, but the exact headcount included in Start itself is not published anywhere on the pricing page, the plan-comparison table, or the Help Center article "How to choose a pricing plan" — only the deltas are. Start''s own description ("For starters and solo operators") is read as the natural single-seat baseline, the same "assume 1 when a base-plan-plus-additional-user structure doesn''t state it" convention used for SingleOps elsewhere on this site, giving max_seats of 1 / 6 / 16 for Start / Grow / Scale respectively. Regular annual (yearly) prices are recorded as primary tiers; the higher month-to-month prices are `compare: false` secondary tiers, per this site''s standing convention.'

