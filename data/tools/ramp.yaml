slug: ramp
vendor: Ramp
product: Ramp
category: expense_management
url: https://ramp.com/pricing
free_trial: "Ramp Plus offered as a free 30-day trial; Ramp Free itself has no trial to expire (stated 2026-09-04)."
pricing_note: "Ramp Free has no per-user charge; Ramp Plus adds $15/user/month plus an undisclosed 'platform fee based on team size' on top, so the true cost of Plus for any given team size is not fully computed from the published per-seat figure alone. Enterprise is custom, billed annually."

