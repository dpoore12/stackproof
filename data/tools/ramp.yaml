      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Free $0/mo/user. Best for smaller teams who want to simplify finances." Unlimited cards, card issuing controls, travel & expense via SMS/Slack, AP automation (OCR, approval workflows), Treasury (4.2% investment account, 2% FDIC-insured cash, no fees/minimums), basic accounting automation, budgets & reporting, vendor management.'
  - plan: Plus
    base_monthly_usd: 15
    per_seat_monthly_usd: 15
    seat_label: user
    billing: monthly
    provenance:
      source_url: https://ramp.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Plus $15/mo/user + Platform fee based on team size. Save 20% with annual billing." All Free features plus AI-driven expense reviews and policy insights, 24/7 phone support for travel, auto-coded line items, AI approval recommendations, NetSuite/Sage Intacct integrations, multi-entity support, custom user roles, audit log. Platform fee amount not published on this page.'

