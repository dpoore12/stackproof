findings:
  - id: ramp-plus-hidden-platform-fee
    claim: >-
      Ramp Plus is advertised at "$15/mo/user" but the same pricing card
      adds "+ Platform fee based on team size" with no published amount,
      so the per-seat figure alone understates the plan's real monthly
      cost (2026-09-04).
    provenance:
      source_url: https://ramp.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: ramp-treasury-yield
    claim: >-
      Ramp's Free plan advertises earning "4.2%* in a Ramp Investment
      Account" or "2%* on cash in a FDIC-insured account" with "No fees,
      minimum deposits, or transfer caps," monetizing idle cash rather
      than charging a software fee (2026-09-04).
    provenance:
      source_url: https://ramp.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: ramp-card-pays-subscription
    claim: >-
      Ramp's FAQ states a customer "can pay for Ramp Plus with ACH or the
      rewards you earn from your Ramp card spending," letting card
      rewards offset the software subscription (2026-09-04).
    provenance:
      source_url: https://ramp.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
