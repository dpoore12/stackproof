pricing_note: 'MoveitPro+ sells one feature set ("no tier gating") priced by a base-plus-per-office-user formula, with the base rate set by a chosen commitment length (12/24/36-month agreement) rather than a plan name. The 12-month agreement is recorded as the primary comparable rate, matching this site''s standing annual-vs-monthly convention; the 24-month and 36-month agreements unlock progressively cheaper per-user rates ($75 and $70/mo respectively, vs. $80/mo on the 12-month term) and are recorded as findings rather than additional tiers, since this site''s schema has no billing period beyond "biennial." Crew accounts are free (view-only); a $20/mo per-user "Crew Pro App" add-on is optional and not part of the base cost.'

