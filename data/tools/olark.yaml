findings:
  - id: olark-human-only-29-per-agent
    claim: >-
      On 2026-09-03 Olark priced its human-only live chat at $29 per agent
      per month, the same product it says it has sold since 2009, with a
      free trial and no card required.
    provenance:
      source_url: https://www.olark.com/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - id: olark-ai-agent-flat-400
    claim: >-
      Olark's Standard AI Website Agent costs $400 per month billed annually
      ($4,800 a year) for unlimited AI conversations with 1 human seat
      included and $29 per extra agent, so 3 agents cost $458 (2026-09-03).
    provenance:
      source_url: https://www.olark.com/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - id: olark-no-usage-fees
    claim: >-
      Olark states it charges no token or per-conversation fees and has no
      conversation limit, unlike Intercom's $0.99 per Fin outcome or Tidio's
      billable-conversation quotas (2026-09-03).
    provenance:
      source_url: https://www.olark.com/pricing
      fetched_at: 2026-09-03
      method: live_fetch
  - id: olark-five-agent-cost
    claim: >-
      At Olark's 2026-09-03 rates 5 human-only agents cost $145 per month,
      or $516 with the AI agent plan, against $145 on Intercom Essential
      and $245 on LiveChat Team for 5 seats.
    provenance:
      source_url: https://www.olark.com/pricing
      fetched_at: 2026-09-03
      method: live_fetch
