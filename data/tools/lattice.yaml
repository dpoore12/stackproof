clauses:
  - topic: billing_timing
    status: stated
    quote: "Is the contract billed monthly, quarterly, or annually? Lattice bills all contracts annually."
    finding: >-
      Lattice bills every contract annually with no monthly or quarterly
      option (2026-09-04).
    provenance:
      source_url: https://lattice.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: cancellation
    status: not_stated
    finding: >-
      Lattice's pricing FAQ states no cancellation terms (2026-09-04).
    provenance:
      source_url: https://lattice.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: not_stated
    finding: >-
      Lattice's pricing FAQ states no refund terms (2026-09-04).
    provenance:
      source_url: https://lattice.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: lattice-minimum-annual-agreement
    claim: >-
      Lattice's FAQ states, "Yes. The minimum annual agreement is
      $4,000," which can bind on small teams below roughly 25 seats on
      the Foundations bundle (2026-09-04).
    provenance:
      source_url: https://lattice.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: lattice-usd-only-billing
    claim: >-
      Lattice's FAQ states, "Lattice bills in United States Dollars
      (USD) only. This applies across all products and services"
      (2026-09-04).
    provenance:
      source_url: https://lattice.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: lattice-faq-price-inconsistency
    claim: >-
      Lattice's own FAQ states Performance and Goals & OKRs "can be
      unbundled and purchased individually for $8/month," but its
      product cards print Performance at $10/seat/month and only Goals
      & OKRs at $8/seat/month (2026-09-04).
    provenance:
      source_url: https://lattice.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
