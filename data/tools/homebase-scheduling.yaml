slug: homebase-scheduling
vendor: Homebase (Pioneer Works)
product: Homebase
category: shift_scheduling
url: https://www.joinhomebase.com/pricing
free_trial: "Free 14-day trial of the All-in-One plan; if no plan is chosen at the end, the account reverts to the free Basic plan (2026-09-04)."
pricing_note: "Homebase prices per location with unlimited employees on every paid tier, not per employee: \"$30/location/month unlimited employees\" (Essentials) and so on through All-in-One. Because this category's comparison axis is employee headcount, Homebase's price does not scale with it at all above the free Basic tier, so all tiers here are marked non-comparable (compare: false) even though the dollar figures are real, dated, and self-serve. Basic is free but capped at 1 location and 10 employees. Also tracked separately in this dataset under the payroll category as \"homebase\" (Homebase Payroll), since that record prices a different product (the payroll add-on) fetched on a different date."

