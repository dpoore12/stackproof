clauses:
  - topic: cancellation
    status: stated
    quote: "You can change your Homebase plan at any time – and the newly chosen plan will get activated at the start of the next billing cycle."
    finding: >-
      Homebase lets customers change plans at any time, with the new
      plan taking effect at the start of the next billing cycle
      (2026-09-04).
    provenance:
      source_url: https://www.joinhomebase.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: not_stated
    finding: >-
      Homebase's pricing FAQ states no money-back-guarantee or refund
      terms (2026-09-04).
    provenance:
      source_url: https://www.joinhomebase.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    quote: "If you don't have any plan selected at the end of your 14-day free All-in-One trial, you will automatically be switched to the free Basic Plan."
    finding: >-
      Homebase automatically downgrades an unselected trial to the free
      Basic plan rather than charging a default paid plan (2026-09-04).
    provenance:
      source_url: https://www.joinhomebase.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: homebase-per-location-not-per-employee
    claim: >-
      Homebase's paid plans charge per location with unlimited employees
      included, from $24/month (Essentials, billed annually) to
      $96/month (All-in-One, billed annually) per location (2026-09-04).
    provenance:
      source_url: https://www.joinhomebase.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: homebase-basic-plan-cap
    claim: >-
      Homebase's free Basic plan is capped at exactly 1 location and 10
      employees; teams above either limit must upgrade to a paid,
      per-location plan (2026-09-04).
    provenance:
      source_url: https://www.joinhomebase.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
