      note: 'FAQ JSON-LD: "Trellis Plus pricing depends on your subscription term: Annual billing: $28 per user/month; Monthly billing: $35 per user/month".'

clauses:
  - topic: billing_timing
    status: stated
    finding: >-
      Sprout Social's annual billing is a single upfront payment for the
      whole term; plans with multiple payments in a term do not get the
      discount, and monthly billing runs $20 to $100 more per seat
      (2026-09-04).
    quote: "Annual billing requires a one-time upfront payment for the entire subscription term"
    provenance:
      source_url: https://sproutsocial.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: cancellation
    status: not_stated
    finding: >-
      Sprout Social's pricing page states no cancellation or refund terms;
      the FAQ says only that a plan can be changed (2026-09-04).
    provenance:
      source_url: https://sproutsocial.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      Sprout Social's pricing page states no data-export terms (2026-09-04).
    provenance:
      source_url: https://sproutsocial.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: sprout-monthly-premium
    claim: >-
      Sprout Social's monthly billing costs $99, $249, $399 and $499 per
      seat against $79, $199, $299 and $399 on annual billing, a premium of
      25% on Standard and Essentials and 33% on Professional (2026-09-04).
    provenance:
      source_url: https://sproutsocial.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: sprout-ai-credits
    claim: >-
      Every Sprout Social seat includes 100 Trellis AI credits a month;
      Trellis Plus costs $28 per user a month on annual billing or $35
      monthly (2026-09-04).
    provenance:
      source_url: https://sproutsocial.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: sprout-profile-caps
    claim: >-
      Sprout Social caps Essentials and Standard at 5 social profiles per
      account, with Professional and Advanced unlimited; brand keywords per
      group run 0, 10, 10 and 20 (2026-09-04).
    provenance:
      source_url: https://sproutsocial.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: sprout-unpriced-addons
    claim: >-
      Sprout Social lists 3 add-ons (Premium Analytics, Listening, Employee
      Advocacy) available from Standard up with no published price
      (2026-09-04).
    provenance:
      source_url: https://sproutsocial.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
