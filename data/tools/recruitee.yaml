findings:
  - id: recruitee-no-published-prices
    claim: >-
      Tellent Recruitee's pricing page on 2026-09-04 published 0 prices for
      its 3 plans; each card ends in "Get a demo" and the FAQ says price
      depends on plan, employee count and billing period.
    provenance:
      source_url: https://recruitee.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: recruitee-one-year-minimum
    claim: >-
      Tellent Recruitee requires a 1-year minimum contract with optional
      monthly payment, and gives 20% off for paying the year upfront
      (2026-09-04).
    provenance:
      source_url: https://recruitee.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: recruitee-job-and-ai-limits
    claim: >-
      Tellent Recruitee's Start plan caps active job posts at 5; Advance
      includes 100 AI screening credits and 3 AI matching searches a month,
      rising to 65 searches on Optimize (2026-09-04).
    provenance:
      source_url: https://recruitee.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
