      fetched_at: 2026-09-03
      method: live_fetch
      note: 'Browser-rendered fetch. "$11/month … This is an annual commitment of $132." Single user; 5 envelopes per month.'
  - plan: Standard
    base_monthly_usd: 0
    per_seat_monthly_usd: 30
    seat_label: user
    max_seats: 50
    billing: annual
    provenance:
