clauses:
  - topic: cancellation
    status: stated
    finding: >-
      Docusign's displayed prices are an annual commitment paid monthly ($132,
      $360 or $540 per user per year); month-to-month costs up to 33% more
      (2026-09-03).
    quote: "This is an annual commitment of $360."
    provenance:
      source_url: https://ecom.docusign.com/plans-and-pricing/esignature
      fetched_at: 2026-09-03
      method: live_fetch
  - topic: billing_timing
    status: stated
    finding: >-
      Envelope allowances are 5 per month on Personal and 100 per user per
      year on Standard and Business Pro; an envelope counts once however many
      documents or signers it holds (2026-09-03).
    provenance:
      source_url: https://ecom.docusign.com/plans-and-pricing/esignature
      fetched_at: 2026-09-03
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      Docusign's pricing page states no data-export or account-closure terms
      (2026-09-03).
    provenance:
      source_url: https://ecom.docusign.com/plans-and-pricing/esignature
      fetched_at: 2026-09-03
      method: live_fetch

findings:
  - id: docusign-plan-prices-annual-commitment
    claim: >-
      On 2026-09-03 Docusign eSignature listed Personal at $11 per month,
      Standard at $30 and Business Pro at $45 per user per month, each an
      annual commitment billed monthly, with annual advertised as up to 33%
      below month-to-month.
    provenance:
      source_url: https://ecom.docusign.com/plans-and-pricing/esignature
      fetched_at: 2026-09-03
      method: live_fetch
  - id: docusign-envelope-caps
    claim: >-
      Docusign caps sending at 5 envelopes per month on Personal and 100 per
      user per year on Standard and Business Pro, so a Standard user who sends
      more than about 8 documents a month needs an Enhanced plan (2026-09-03).
    provenance:
      source_url: https://ecom.docusign.com/plans-and-pricing/esignature
      fetched_at: 2026-09-03
      method: live_fetch
  - id: docusign-user-caps
    claim: >-
      Docusign's Personal plan is single-user and Standard and Business Pro
      stop at 50 users; teams above 50 are routed to contact sales
      (2026-09-03).
    provenance:
      source_url: https://ecom.docusign.com/plans-and-pricing/esignature
      fetched_at: 2026-09-03
      method: live_fetch
  - id: docusign-sms-and-idv-addons
    claim: >-
      Docusign's SMS delivery add-on starts at $0.36 per delivery and identity
      verification at $2.40 per attempt, sold only on Standard and Business
      Pro after 5 one-time bonus uses of each (2026-09-03).
    provenance:
      source_url: https://ecom.docusign.com/plans-and-pricing/esignature
      fetched_at: 2026-09-03
      method: live_fetch
  - id: docusign-five-user-cost
    claim: >-
      At Docusign's 2026-09-03 annual-commitment rates a 5-user team pays
      $150 per month on Standard or $225 on Business Pro, which is $1,800 or
      $2,700 committed for the year.
    provenance:
      source_url: https://ecom.docusign.com/plans-and-pricing/esignature
      fetched_at: 2026-09-03
      method: live_fetch
