findings:
  - id: mycase-no-contract-no-setup-fee
    claim: >-
      MyCase's FAQ states there is no long-term contract and no setup
      fee on any of its three plans (2026-09-04).
    provenance:
      source_url: https://www.mycase.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

clauses:
  - topic: cancellation
    status: stated
    quote: "You can easily cancel your account within the Settings section at any time. Please note that any previously paid fees are non-refundable."
    finding: >-
      MyCase allows self-service cancellation at any time from account
      settings, but states previously paid fees are non-refundable
      (2026-09-04).
    provenance:
      source_url: https://www.mycase.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: stated
    quote: "Please note that any previously paid fees are non-refundable."
    finding: >-
      MyCase states that previously paid fees are non-refundable upon
      cancellation (2026-09-04).
    provenance:
      source_url: https://www.mycase.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
