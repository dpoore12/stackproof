findings:
  - id: gymdesk-active-member-definition
    claim: >-
      Gymdesk excludes visitors, frozen members, cancelled clients, and
      prospects from its active-member count used to determine pricing
      tier (2026-09-04).
    provenance:
      source_url: https://gymdesk.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: gymdesk-no-exit-fee
    claim: >-
      Gymdesk charges no fee to cancel and no fee to export data on the
      way out, and offers a 30-day free trial with no credit card
      required (2026-09-04).
    provenance:
      source_url: https://gymdesk.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

clauses:
