  - topic: billing_timing
    status: stated
    finding: >-
      Formstack takes Mastercard, Visa, Discover and American Express, offers
      annual invoices on certain plans, and applies its nonprofit discount to
      invoices but not the annual discount (2026-09-04).
    quote: "The nonprofit discount applies to invoices, but the annual discount does not."
    provenance:
      source_url: https://www.formstack.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: formstack-single-builder-user
    claim: >-
      Formstack's Forms plan includes 1 builder user for $83 a month on
      annual billing ($99 monthly) and Suite includes 3 for $250 ($299
      monthly); extra users are sold as add-ons with no published price
      (2026-09-04).
    provenance:
      source_url: https://www.formstack.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: formstack-annual-discount
    claim: >-
      Formstack's annual plans save 2 months: Forms drops from $99 to $83
      a month and Suite from $299 to $250 (2026-09-04).
    provenance:
      source_url: https://www.formstack.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: formstack-submission-caps-per-form
    claim: >-
      Formstack caps submissions per form rather than per account: 1,000 on
      Forms and 5,000 on Suite, with 25 and 100 forms and 2 GB and 10 GB of
      storage (2026-09-04).
    provenance:
      source_url: https://www.formstack.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: formstack-hipaa-addon
    claim: >-
      Formstack lists HIPAA and compliance as a paid add-on on both
      self-serve plans, with no add-on price on the page; live support runs
      Monday to Friday 8 a.m. to 4 p.m. ET (2026-09-04).
    provenance:
      source_url: https://www.formstack.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
