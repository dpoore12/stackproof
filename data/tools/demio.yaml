findings:
  - id: demio-annual-discount
    claim: >-
      Demio's page banner states "Save 30%" for annual billing, and its
      own printed figures confirm this closely: Starter $45 vs $63/month
      (29% off), Growth $80 vs $117 (32% off), Premium $196 unchanged
      between the two captures (2026-09-04).
    provenance:
      source_url: https://www.demio.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: demio-starter-single-host-cap
    claim: >-
      Demio's Starter plan is hard-capped at exactly 1 host: "You'll need
      to purchase multiple hosts if you plan to run more than one event
      simultaneously. Our starter plan is limited to one host"
      (2026-09-04).
    provenance:
      source_url: https://www.demio.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: demio-premium-unlimited-hosts
    claim: >-
      Demio states "there is no limit to the number of hosts per account
      with our premium plan," unlike Growth's "Per Host" pricing model
      where each simultaneous-event host must be purchased separately
      (2026-09-04).
    provenance:
      source_url: https://www.demio.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
