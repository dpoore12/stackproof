clauses:
  - topic: cancellation
    status: stated
    quote: "If you cancel, we'll bill you for the current month, but won't bill you again if you're not under a contract."
    finding: >-
      7shifts bills through the current month on cancellation but stops
      billing afterward for customers not under a term contract
      (2026-09-04).
    provenance:
      source_url: https://www.7shifts.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: not_stated
    finding: >-
      7shifts' pricing FAQ states no money-back-guarantee or refund
      terms beyond its cancellation policy (2026-09-04).
    provenance:
      source_url: https://www.7shifts.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    quote: "We take payment by credit card as well as ACH (automatic bank withdrawals), by request. You choose whether you want to pay monthly or annually. We'll charge your credit card or bank accordingly at each period."
    finding: >-
      7shifts accepts credit card or ACH payment, charged at the start
      of each billing period the customer selects (2026-09-04).
    provenance:
      source_url: https://www.7shifts.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: 7shifts-tier-employee-ceilings
    claim: >-
      7shifts gates its named tiers by an employee-count ceiling per
      location rather than a linear per-employee rate: Comp allows 15
      employees, Essentials 30, Pro 60, and Premium unlimited
      (2026-09-04).
    provenance:
      source_url: https://www.7shifts.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: 7shifts-premium-bundled-addon-value
    claim: >-
      7shifts prices Premium's bundled add-ons individually at $39.99
      (Payroll) plus $49.99 (Tip Management) plus $12.99 (Task
      Management) plus $99.00 (Employee Training) if bought separately
      on lower tiers (2026-09-04).
    provenance:
      source_url: https://www.7shifts.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
