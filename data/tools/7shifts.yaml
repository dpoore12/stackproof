slug: 7shifts
vendor: 7shifts
product: 7shifts
category: shift_scheduling
url: https://www.7shifts.com/pricing
free_trial: "14-day free trial with full access to the Pro plan's features, no credit card required; unselected trials fall back to the free Comp plan (2026-09-04)."
pricing_note: "7shifts prices per location with an employee-count ceiling attached to each named tier (15/30/60/unlimited), not a flat per-employee rate: a location upgrades to the next plan once it needs more employees than its current tier allows, rather than paying more per additional employee within a tier. The Premium tier's optional $6/employee/month payroll surcharge only applies if the location also uses 7shifts Payroll, so it is recorded as a separate fee, not folded into the base tier price."

