findings:
  - id: octopuspro-gutter-cleaning-page
    claim: >-
      OctopusPro maintains a dedicated "Gutter Cleaning Software" page
      covering gutter-cleaner-to-job matching, digital intake forms,
      and gutter supplies/equipment stock control, per its site as of
      2026-09-05.
    provenance:
      source_url: https://octopuspro.com/gutter-cleaning-software/
      fetched_at: 2026-09-05
      method: live_fetch
  - id: octopuspro-unlimited-usage-fee
    claim: >-
      OctopusPro's Unlimited Users plan charges a $99/month platform
      licence with unlimited seats, plus a usage-based fee the
      customer chooses between — $1 per booked job with a fieldworker
      assigned, or a 2% commission on monthly invoiced revenue — per
      its pricing FAQ as of 2026-09-05.
    provenance:
      source_url: https://octopuspro.com/pricing/
      fetched_at: 2026-09-05
      method: live_fetch
