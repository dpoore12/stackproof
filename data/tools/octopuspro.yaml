slug: octopuspro
vendor: OctopusPro
product: OctopusPro
category: gutter_cleaning_business_management
url: https://octopuspro.com/pricing/
pricing_note: >-
  OctopusPro is a horizontal field-service tool serving dozens of
  trades, included here under this site's "generic tool with a
  genuine dedicated niche landing page" exception — its
  /gutter-cleaning-software/ page is extensive and genuinely
  gutter-cleaning-specific. Established prices admin seats and
  fieldworker seats on two independent per-seat rates with no bundled
  free seat of either kind; it is modeled here as a fixed 1-admin cost
  (the minimum viable configuration to run the plan) plus a per-seat
  rate for each fieldworker, matching this site's seat-axis convention
  of counting working crew as "seats." Unlimited's $99 platform fee is
  a flat, unlimited-seat number; its usage-based add-on (a
  per-completed-job fee or a percentage-of-revenue commission, the
  customer's choice) is not a per-seat charge and is recorded only as
  a Finding.

