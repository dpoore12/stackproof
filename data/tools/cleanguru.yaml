pricing_note: 'CleanGuru is a bidding/estimating platform for janitorial and commercial cleaning contractors. Its page states "Additional cleaners, just $5/mo!" as a standing note following the plan comparisons, with a "10" cleaner-count figure shown directly under the Guru! plan''s feature list; that figure is applied to all three paid tiers as the most directly observed included-cleaner count, since a separate per-tier figure could not be isolated. Basic is limited to choosing 1 of 8 cleaning-type modules (Janitorial, Construction, Disinfecting, Move In/Out, Maid, Tile, Carpet, Window); Guru! and Guru Plus include all 8.'

