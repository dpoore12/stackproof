pricing_note: 'CloseWise sells two distinct tracks from the same pricing page: solo-notary plans (Pro, Pro+) capped at one seat, and signing-service/title-company plans (Starter, Professional) that scale by team-member cap rather than a genuine per-seat formula — each tier is a flat rate good for up to a stated number of team members, with no incremental per-additional-member price disclosed. Starter and Professional also carry a per-order fee ($2 and $1.50 respectively) not modeled here since this site compares the seat-based rate, not per-transaction fees. Enterprise is quote-gated and excluded. The free plan is excluded per this site''s policy against ranking $0 tiers as cheapest.'

