      (2026-09-04).
    provenance:
      source_url: https://www.atlassian.com/software/statuspage/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    quote: "We do, although right now the setup is manual and requires a signed order form. If you're looking to sign up for a yearly plan via credit card, contact our support team and we're happy to help."
    finding: >-
      Statuspage's FAQ states yearly credit-card billing is not self-serve:
      it requires a signed order form processed manually by support
      (2026-09-04).
    provenance:
      source_url: https://www.atlassian.com/software/statuspage/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: statuspage-team-member-definition
    claim: >-
      Statuspage's FAQ defines the billed unit: "Team members are people
      that can log into your account and do things ... to update your
      status page," distinct from public subscribers (2026-09-04).
    provenance:
      source_url: https://www.atlassian.com/software/statuspage/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: statuspage-sso-included
    claim: >-
      Statuspage includes Single Sign-On with Atlassian Guard at no extra
      charge on Startup, Business and Enterprise (Public) and on every
      Private Page plan, as of 2026-09-04.
    provenance:
      source_url: https://www.atlassian.com/software/statuspage/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: statuspage-private-page-guidance
    claim: >-
      Statuspage's FAQ advises companies typically adopt a Private Page
      "around the 50 employee mark and up," since chat or email alone
      breaks down as a status channel below that size (2026-09-04).
    provenance:
      source_url: https://www.atlassian.com/software/statuspage/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: statuspage-audience-specific-tier
    claim: >-
      Beyond Public and Private Pages, Statuspage sells "Audience-specific
      pages" starting at $300/month, with team members starting at 25 and
      users starting at 500 (2026-09-04).
    provenance:
      source_url: https://www.atlassian.com/software/statuspage/pricing
      fetched_at: 2026-09-04
      method: live_fetch
