slug: atlassian-statuspage
vendor: Atlassian
product: Statuspage
category: uptime_monitoring
url: https://www.atlassian.com/software/statuspage/pricing
free_trial: "No trial needed for the Free public-page plan (2 team members, 100 subscribers), which runs indefinitely at $0; paid plans are self-serve 'Get started today' signups (2026-09-04)."
pricing_note: "Statuspage sells two distinct product lines at different prices for similar team-member counts: Public Pages (customer-facing status communication) and Private Pages (internal-only, gated by 'authenticated subscribers' instead of public subscriber counts). Because most buyers researching status-page pricing want the customer-facing product, Public Page tiers are used for this category's comparison table; Private Page tiers are recorded for reference but marked non-comparable (compare: false) to avoid blending two different products into one misleading 'cheapest' figure. A third line, Audience-specific pages, starts at $300/month and is recorded as a finding only, not as a priced tier."

