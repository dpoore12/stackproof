clauses:
  - topic: cancellation
    status: not_stated
    finding: >-
      Statuspage's pricing FAQ (public and private) states no cancellation
      terms (2026-09-04).
    provenance:
      source_url: https://www.atlassian.com/software/statuspage/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: not_stated
    finding: >-
