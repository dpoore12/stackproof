support:
  channels: ["Live Chat", "email"]
  measured_first_response_minutes: 25
  provenance:
    source_url: https://www.statuscake.com/pricing/
    fetched_at: 2026-09-04
    method: live_fetch
    note: '"Support Level: StatusCake provides support via Live Chat and email ... In the last 12 months, our support team achieved a median first response time of 25 minutes and resolved issues within 6 hours and 15 minutes on average ... 92.5% of experiences rated as Good or Excellent."'

clauses:
  - topic: cancellation
    status: stated
    quote: "You can cancel your subscription anytime, even mid-billing cycle. Upon cancellation, you retain access to paid plan features until the current cycle ends, maximizing your service usage."
    finding: >-
      StatusCake states subscriptions can be cancelled at any time,
      including mid-cycle, with no penalties or fees, and access continues
      until the current billing cycle ends (2026-09-04).
    provenance:
      source_url: https://www.statuscake.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: not_stated
    finding: >-
      StatusCake's pricing FAQ states no money-back-guarantee or refund
      terms; its 7-day trial converts to the free plan rather than issuing
      a refund if no card is added (2026-09-04).
    provenance:
      source_url: https://www.statuscake.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    quote: "If you've added your card and choose to continue with a paid plan, your card will be charged at the trial's end. Your subscription billing period will start from that point onward."
    finding: >-
      StatusCake charges a card on file at the end of the 7-day trial and
      starts the billing cycle from that date (2026-09-04).
    provenance:
      source_url: https://www.statuscake.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: statuscake-support-response-time
    claim: >-
      StatusCake reports a median first-response time of 25 minutes and an
      average resolution time of 6 hours 15 minutes across the last 12
      months of support tickets, as stated 2026-09-04.
    provenance:
      source_url: https://www.statuscake.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: statuscake-seat-monitor-coupling
    claim: >-
      StatusCake ties team-member count directly to monitor allowance:
      Free is 1 login with 3 monitors, Superior is 2 logins with 100
      monitors, Business is 10 logins with 300 monitors (2026-09-04).
    provenance:
      source_url: https://www.statuscake.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: statuscake-trial-length-inconsistency
    claim: >-
      StatusCake's own FAQ is internally inconsistent about trial length:
      one heading states a "7 days" trial while the very next answer
      references a "14-day trial" for accounts with no card (2026-09-04).
    provenance:
      source_url: https://www.statuscake.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
