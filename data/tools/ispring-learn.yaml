findings:
  - id: ispring-learn-active-user-billing
    claim: >-
      iSpring Learn bills "for active users only," where "a user will be
      considered active if s/he has logged in at least once during a
      month," per its pricing FAQ (2026-09-04).
    provenance:
      source_url: https://www.ispringsolutions.com/ispring-learn/pricing
      fetched_at: 2026-09-04
      method: live_fetch

clauses:
  - topic: refund
    status: stated
    quote: "Pay only for active users. Money-back guarantee."
    finding: >-
      iSpring Learn's pricing page states a "Money-back guarantee"
      without itemizing its terms on this page (2026-09-04).
    provenance:
      source_url: https://www.ispringsolutions.com/ispring-learn/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    quote: "100 users: $6.91 USD per user/month, $8,286 annual price."
    finding: >-
      iSpring Learn's Business plan is billed as a single annual price
      for each user-count step, not month-to-month (2026-09-04).
    provenance:
      source_url: https://www.ispringsolutions.com/ispring-learn/pricing
      fetched_at: 2026-09-04
      method: live_fetch
