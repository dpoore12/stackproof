    provenance:
      source_url: https://quickbooks.intuit.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
      note: 'Page lists "Free $0/mo". A nearby line reads "Send 2 invoices per month", which appears to be a Free-plan limit; verify on account.'

