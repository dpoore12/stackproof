clauses:
  - topic: cancellation
    status: stated
    finding: >-
      QuickBooks Online's pricing page states "Cancel anytime" and asks "Can I
      switch plans or cancel at any time?" in its FAQ (2026-09-03).
    quote: "Cancel anytime"
    provenance:
      source_url: https://quickbooks.intuit.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - topic: price_change
    status: stated
    finding: >-
      Every paid QuickBooks Online plan on 2026-09-03 was displayed at 50% off
      its regular price; the regular prices ($38 to $275 per month) are what
      the plans bill at once the promotion ends.
    provenance:
      source_url: https://quickbooks.intuit.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - topic: data_export
    status: needs_account
    finding: >-
      Data-export terms and per-plan user limits are not in the parsed pricing
      page (2026-09-03); pending verification on an account.
    provenance:
      source_url: https://quickbooks.intuit.com/pricing/
      fetched_at: 2026-09-03
      method: not_available

findings:
  - id: quickbooks-online-regular-prices
    claim: >-
      On 2026-09-03 QuickBooks Online listed regular prices of $38 (Simple
      Start), $74 (Essentials), $115 (Plus) and $275 (Advanced) per month,
      each shown struck through to a 50%-off promotional rate of $19, $37,
      $57.50 and $137.50.
    provenance:
      source_url: https://quickbooks.intuit.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: quickbooks-online-free-tier
    claim: >-
      QuickBooks Online's pricing page on 2026-09-03 listed a Free plan at
      $0/month alongside the paid tiers, with a nearby limit of 2 invoices
      per month.
    provenance:
      source_url: https://quickbooks.intuit.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
      note: "The 2-invoice limit's association with the Free plan is inferred from page position; verify on account."
  - id: quickbooks-online-vs-xero-vs-zoho-entry
    claim: >-
      At regular 2026-09-03 prices, the entry paid accounting plans were $20
      (Zoho Books Standard), $25 (Xero Early) and $38 (QuickBooks Simple
      Start) per month, before any promotion.
    provenance:
      source_url: https://quickbooks.intuit.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
