slug: jotform
vendor: Jotform
product: Jotform
category: forms
url: https://www.jotform.com/pricing/
free_trial: "No trial of paid plans; a Starter (free) plan carries all standard features except HIPAA (stated 2026-09-04)."
pricing_note: "Bronze, Silver and Gold are single-user plans priced per account; only Enterprise is multiuser and it has no listed price. The page defaults to yearly billing and the monthly figures did not render in the automated fetch, so tiers carry the annual rate."

# Single-user plans: the seat count cannot exceed 1 outside Enterprise, so
# every paid tier is capped at 1 seat.
