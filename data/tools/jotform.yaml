clauses:
  - topic: cancellation
    status: stated
    finding: >-
      Jotform keeps a cancelled paid plan active until the next billing date
      and then downgrades the account to the free Starter plan; downgrades to
      a cheaper paid plan take effect immediately with unused time credited
      to the next invoice (2026-09-04).
    quote: "When you cancel a paid plan, you will still stay on your existing plan until the next billing date, and then you will be downgraded to the Starter plan."
    provenance:
      source_url: https://www.jotform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: auto_renew
    status: stated
    finding: >-
      Jotform subscriptions renew automatically each month or each year
      unless cancelled (2026-09-04).
    quote: "Your subscription will automatically be renewed each month for monthly plans and each year for yearly plans unless you cancel."
    provenance:
      source_url: https://www.jotform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: stated
    finding: >-
      Jotform refunds in full when a subscription is cancelled within 30
      days of payment, on request to support (2026-09-04).
    quote: "If, for any reason, you need to cancel your subscription within 30 days of payment, we’ll issue a full refund."
    provenance:
      source_url: https://www.jotform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_retention
    status: stated
    finding: >-
      Jotform deletes the oldest form response to make room once an account
      exceeds its total submission storage (500 on Starter, 10,000 on
      Bronze), and advises downloading old submissions first (2026-09-04).
    quote: "if you exceed your total submission storage, the system will delete the oldest form response to make room for new submissions"
    provenance:
      source_url: https://www.jotform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: stated
    finding: >-
      Jotform's FAQ tells users they can download old submissions before
      purging them to stay under the storage cap; no export format or
      post-cancellation window is given (2026-09-04).
    provenance:
      source_url: https://www.jotform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: jotform-single-user-paid-plans
    claim: >-
      Jotform's Bronze ($34), Silver ($39) and Gold ($99) plans are each a
      "1 User Individual Plan" on annual billing; a second user requires the
      quote-only Enterprise plan (2026-09-04).
    provenance:
      source_url: https://www.jotform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: jotform-submission-caps
    claim: >-
      Jotform caps monthly submissions at 100 on Starter, 1,000 on Bronze,
      2,500 on Silver and 10,000 on Gold, with total stored submissions of
      500 / 10,000 / 25,000 / 100,000 (2026-09-04).
    provenance:
      source_url: https://www.jotform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: jotform-meta-price-mismatch
    claim: >-
      Jotform's page metadata still says "Paid plans start at $19 per month"
      while the cheapest rendered plan on 2026-09-04 was Bronze at $34 per
      month on annual billing.
    provenance:
      source_url: https://www.jotform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: jotform-nonprofit-education-discount
    claim: >-
      Jotform discounts Bronze, Silver and Gold by 50% and Enterprise by 30%
      for approved nonprofits and educational institutions on both monthly
      and yearly billing (2026-09-04).
    provenance:
      source_url: https://www.jotform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: jotform-eur-parity
    claim: >-
      A fetch of Jotform's pricing routed through a German gateway on
      2026-09-04 showed the same numbers in euros (€34, €39, €99 per month
      billed annually) as the US render showed in dollars.
    provenance:
      source_url: https://www.jotform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: jotform-tax-inclusive
    claim: >-
      Jotform adds local tax to every payment at checkout and removes it
      only for a valid Tax ID, per its FAQ on 2026-09-04; 1 tax-exempt
      certificate route goes through support.
    provenance:
      source_url: https://www.jotform.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
