slug: pingdom
vendor: Pingdom (SolarWinds)
product: Pingdom
category: uptime_monitoring
url: https://www.pingdom.com/pricing/
free_trial: "A free trial is linked from the pricing page ('FREE TRIAL'); the pricing calculator itself can be used with no card to see prices (2026-09-04)."
pricing_note: "Pingdom prices two separate metered products, not team seats: Synthetic Monitoring (uptime/transaction checks) and Real User Monitoring (RUM, by pageviews). Both list \"Unlimited users\" as a feature at every tier, so price does not scale with headcount at all. Because this category's comparison axis is team members with monitoring access, none of Pingdom's tiers are ranked in the category cost table (compare: false throughout); the prices themselves are still real, dated, self-serve figures read directly off the vendor's own calculator at its smallest slider setting. The calculator showed annual billing by default at fetch time; the monthly-billing alternative requires toggling a switch that a static fetch does not capture."

