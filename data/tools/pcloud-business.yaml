findings:
  - id: pcloud-eur-usd-parity
    claim: >-
      pCloud renders identical numerals for EUR and USD on its Business
      pricing page (9.99, 29.97, 14.98, 44.94 under both currency labels
      depending on gateway region), so the price is not FX-converted
      between the two currencies as measured on 2026-09-04.
    provenance:
      source_url: https://www.pcloud.com/business.html
      fetched_at: 2026-09-04
      method: live_fetch
  - id: pcloud-seat-minimum
    claim: >-
      pCloud Business requires a minimum of 3 users at $9.99 per user a
      month billed monthly, so the cheapest possible Business plan costs
      $29.97 a month regardless of team size below 3 (2026-09-04).
    provenance:
      source_url: https://www.pcloud.com/business.html
      fetched_at: 2026-09-04
      method: live_fetch
  - id: pcloud-pro-promo-gate
    claim: >-
      pCloud's advertised Business Pro price of $14.98 per user a month is
      a new-account-only promo; the page states it excludes existing
      accounts, renewals, plan changes, seat additions, and reactivations,
      which stand at $19.98 per user a month (2026-09-04).
    provenance:
      source_url: https://www.pcloud.com/business.html
      fetched_at: 2026-09-04
      method: live_fetch
  - id: pcloud-compliance-marks
    claim: >-
      pCloud advertises an EU data center with GDPR, ISO 27001 and ISO
      9001 as Business-plan selling points, alongside client-side
      encryption (2026-09-04).
    provenance:
      source_url: https://www.pcloud.com/business.html
      fetched_at: 2026-09-04
      method: live_fetch
