free_trial: "30-day free trial stated on both plans (stated 2026-09-04)."
pricing_note: "Per-user pricing with a stated 3-user minimum, billed monthly by default on the rendered page (an Annual tab is present but did not re-render on click, so any annual-billed rate is not machine-recorded). Business Pro's shown price is a new-account promo; the standard rate is recorded as the tier and the promo noted separately."

