      note: 'Browser-rendered fetch on a US gateway, "Monthly" billing tab active by default. "Business 3 USERS / 3 TB STORAGE 29.97 USD MONTH 9.99 USD PER USER". 1 TB storage per user, 3+ user minimum, pCloud Encryption, teams and access control, secure file sharing, 180 days file versioning.'
