findings:
  - id: cloudflare-free-tier-50-user-cap
    claim: >-
      Cloudflare's Zero Trust Free plan is capped at 50 users with no
      time limit ("$0 forever"), and is explicitly positioned as usable
      both by small teams and as an enterprise proof-of-concept
      (2026-09-04).
    provenance:
      source_url: https://www.cloudflare.com/plans/zero-trust-services/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: cloudflare-log-retention-tiering
    claim: >-
      Cloudflare tiers Zero Trust log retention by plan: up to 24 hours
      on Free, up to 30 days on Pay-as-you-go, and up to 6 months with
      Logpush-to-SIEM export on Contract plans (2026-09-04).
    provenance:
      source_url: https://www.cloudflare.com/plans/zero-trust-services/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: cloudflare-support-services-gated
    claim: >-
      Cloudflare states enterprise support is only reachable through
      Contract plans: Pay-as-you-go includes chat and ticket support but
      not phone support or professional services, which Contract adds as
      standard or paid add-ons (2026-09-04).
    provenance:
      source_url: https://www.cloudflare.com/plans/zero-trust-services/
      fetched_at: 2026-09-04
      method: live_fetch
