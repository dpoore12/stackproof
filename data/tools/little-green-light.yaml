pricing_note: 'Little Green Light sells "one simple plan" that scales purely by constituent (donor) record count, with unlimited users and every feature at every tier. Beyond 50,000 records the vendor adds $15/month per additional 10,000-record tier (accounts can hold up to 200,000 records) — not modeled as additional steps since this site''s seat points top out well below that range.'

