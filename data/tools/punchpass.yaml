pricing_note: 'Punchpass''s three tiers (Grow, Flow, Pro) differentiate by feature bundle, not by a stated student/class/instructor cap — the entry tier already states "Unlimited classes, passes & instructors." Punchpass markets itself broadly across yoga, fitness, dance, pole, aerial, Pilates, and arts & crafts studios rather than being martial-arts- or dance-specific.'

