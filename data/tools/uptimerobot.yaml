slug: uptimerobot
vendor: UptimeRobot
product: UptimeRobot
category: uptime_monitoring
url: https://uptimerobot.com/pricing/
free_trial: "No paid trial; Free ($0, 50 monitors) runs indefinitely with no credit card, and paid plans can be subscribed to directly (2026-09-04)."
pricing_note: "UptimeRobot's Free and Solo plans include no invitable login seats at all beyond the account owner; Team and Scale include 3 and 5 login seats respectively, with additional seats priced at $19/month billed monthly or $15/month billed annually on both plans, per the page's own feature-comparison table. That per-seat overage rate is recorded directly on the Team and Scale tiers below via per_seat_monthly_usd. All dollar figures here were captured after pinning the fetch to a US-based proxy pool (ip_pool_for_scan: us); an earlier fetch through German-based pools rendered the same page in EUR at different headline numbers (e.g. Team €41/€35 per month vs the US-priced $46/$39), confirming the page geo-prices by request origin rather than showing one universal price."

