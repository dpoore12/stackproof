findings:
  - id: uptimerobot-seat-overage-rate
    claim: >-
      UptimeRobot's Team plan includes 3 login seats and Scale includes 5,
      with additional seats priced at $19/month billed monthly or
      $15/month billed annually on both plans (2026-09-04).
    provenance:
      source_url: https://uptimerobot.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: uptimerobot-notify-vs-login-seats
    claim: >-
      UptimeRobot separates free "notify-only" seats (alert-only, no
      dashboard access) from paid "login seats" (dashboard access),
      including 0/3/5 notify-only seats on Solo/Team/Scale (2026-09-04).
    provenance:
      source_url: https://uptimerobot.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: uptimerobot-geo-pricing
    claim: >-
      UptimeRobot's pricing page renders different headline numbers by
      request origin: a German-routed fetch showed Team at €41/€35 per
      month, while a US-routed fetch of the same page showed $46/$39
      (2026-09-04).
    provenance:
      source_url: https://uptimerobot.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: uptimerobot-ai-agent-pricing-feed
    claim: >-
      UptimeRobot's pricing page links to a "machine-readable pricing (for
      AI agents)" version of its own plan data (2026-09-04).
    provenance:
      source_url: https://uptimerobot.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
