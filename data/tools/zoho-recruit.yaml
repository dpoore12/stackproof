slug: zoho-recruit
vendor: Zoho
product: Zoho Recruit
category: recruiting
url: https://www.zoho.com/recruit/pricing.html
free_trial: "15-day trial of Enterprise features, then a Free plan with 1 active job per recruiter; 45-day money-back guarantee on paid plans (stated 2026-09-04)."
pricing_note: "Priced per recruiter licence with employee or hiring-manager licences sold as an add-on in packs of 10, so the tiers are not compared on the category's employee-count axis. Only yearly rates rendered; the monthly rates behind the 'Save up to 16%' tab were not captured. The page states both that prices include local taxes and that local taxes are charged on top."

