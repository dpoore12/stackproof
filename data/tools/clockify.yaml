clauses:
  - topic: cancellation
    status: stated
    finding: >-
      Clockify lets a subscription be cancelled at any time from the
      Subscription page; access continues until the paid period expires,
      then the workspace drops to the free plan with data kept (2026-09-04).
    quote: "Once you cancel and the current subscription expires, you will be downgraded to the free version and no further charges will be made. You won't lose any data"
    provenance:
      source_url: https://clockify.me/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: stated
    finding: >-
      Clockify offers no refunds except for charges made in error, and
      points users to the 7-day trial before paying (2026-09-04).
    quote: "We don't offer refunds. But, if you were mistakenly charged due to system error, contact us and we'll immediately issue you a refund."
    provenance:
      source_url: https://clockify.me/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    finding: >-
      Clockify prepays annual seats for the full year at 20% off, charges a
      prorated price for seats added mid-cycle, and adds VAT at checkout
      where legally required (2026-09-04).
    quote: "You prepay a seat for the whole year in advance and get 20% OFF. If you add another seat midway, you pay a prorated price for the rest of the year."
    provenance:
      source_url: https://clockify.me/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: stated
    finding: >-
      Clockify keeps all data after cancellation and lists "Export & share
      data" among Basic-plan features; no export terms for the Free plan
      after a downgrade are given (2026-09-04).
    provenance:
      source_url: https://clockify.me/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: clockify-seat-definition
    claim: >-
      Clockify counts every active or invited user, including the Owner and
      Admins, as 1 paid seat, and frees the seat when a user is deactivated
      (2026-09-04).
    provenance:
      source_url: https://clockify.me/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: clockify-basic-enterprise-eur-only
    claim: >-
      On 2026-09-04, 2 of 3 fetches of clockify.me/pricing were routed
      through German gateways and rendered Basic at €3.99 (€4.99 monthly)
      and Enterprise at €11.99 (€14.99 monthly) per seat, so their USD
      prices are not machine-recorded.
    provenance:
      source_url: https://clockify.me/pricing
      fetched_at: 2026-09-04
      method: not_available
  - id: clockify-kiosk-limited-seats
    claim: >-
      Clockify sells kiosk-only "limited seats" at a fraction of a full
      seat: €0.79 to €2.39 per month on annual billing (€0.99 to €2.99
      monthly) across Basic to Enterprise, for staff who clock in only via
      kiosk (2026-09-04).
    provenance:
      source_url: https://clockify.me/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: clockify-annual-discount-only
    claim: >-
      Clockify's only discount is 20% off for annual prepayment; the FAQ
      says it offers no other discounts and no negotiation (2026-09-04).
    provenance:
      source_url: https://clockify.me/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: clockify-geo-currency
    claim: >-
      Clockify's page states it displays prices in the currency of the
      visitor's region; the same digits appeared as US$5.49 on a US gateway
      and € on German gateways on 2026-09-04.
    provenance:
      source_url: https://clockify.me/pricing
      fetched_at: 2026-09-04
      method: live_fetch
