      fetched_at: 2026-09-04
      method: live_fetch
      note: '"$234*/mo per location (Normally $293)." "For growing self-care businesses." Unlimited professionals; 250 free texts, 1,000 free email blasts, 50 GB storage.'
  - plan: Prestige
    base_monthly_usd: 410
    per_seat_monthly_usd: 0
    seat_label: staff member
    billing: monthly
