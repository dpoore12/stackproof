findings:
  - id: boulevard-summer-promo
    claim: >-
      Boulevard was running a "summer pricing" promotion for new customers
      only at time of fetch, discounting Essentials to $140/mo, Premier to
      $234/mo, and Prestige to $328/mo per location (2026-09-04).
    provenance:
      source_url: https://www.joinblvd.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: boulevard-messaging-pricing
    claim: >-
      Boulevard's text marketing has no setup cost and bills per text sent
      or received each month, while email blasts beyond the plan's free
      allotment cost $0.01 per email (2026-09-04).
    provenance:
      source_url: https://www.joinblvd.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
