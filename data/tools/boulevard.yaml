slug: boulevard
vendor: Boulevard
product: Boulevard
category: salon_management
url: https://www.joinblvd.com/pricing
pricing_note: 'Boulevard prices per location rather than strictly per seat, but each tier gates on a staff-count cap ("Up to 5 professionals" on Essentials, "Unlimited professionals" on Premier and Prestige), which is the closest published equivalent to this category''s staff-seat axis. A "Limited-time offer" summer promo was active at fetch time (Essentials $140, Premier $234, Prestige $328); the regular, non-promotional prices are recorded as tiers and the promo is captured as a finding instead.'

tiers:
  - plan: Essentials
    base_monthly_usd: 176
    per_seat_monthly_usd: 0
    max_seats: 5
    seat_label: staff member
    billing: monthly
    provenance:
      source_url: https://www.joinblvd.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"$140*/mo per location (Normally $176)." "For small teams with simple operations." Up to 5 professionals; 100 free texts, 500 free email blasts, 25 GB storage.'
  - plan: Premier
    base_monthly_usd: 293
    per_seat_monthly_usd: 0
