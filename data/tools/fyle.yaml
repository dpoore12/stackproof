slug: fyle
vendor: Sage
product: Sage Expense Management (formerly Fyle)
category: expense_management
url: https://www.fylehq.com/pricing
free_trial: "Fyle offers a demo rather than a self-serve trial on this page (stated 2026-09-04)."
pricing_note: "Fyle (acquired by Sage, now marketed as Sage Expense Management) bills only 'active users': someone who creates at least one expense or has a credit card connected with active transactions in the period, not every named user. Both priced tiers additionally impose a minimum billed-user floor regardless of actual active-user count. Modelled here as base_monthly_usd = minimum floor x per-seat rate, included_seats = the floor."

tiers:
  - plan: Growth
    base_monthly_usd: 59.95
    per_seat_monthly_usd: 11.99
    included_seats: 5
    seat_label: active user
    billing: annual
    provenance:
      source_url: https://www.fylehq.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Growth. Unlimited expense tracking and real-time card feeds. $11.99 per active user*/month, billed annually. Minimum billing: 5 users." *"Users who create at least one expense or have a credit card connected to Sage Expense Management with active transactions." Includes unlimited receipt scanning, mileage/per diem tracking, Amex virtual cards, QuickBooks Online/Xero two-way integration, AI Copilot.'
  - plan: Business
    base_monthly_usd: 149.90
    per_seat_monthly_usd: 14.99
    included_seats: 10
    seat_label: active user
    billing: annual
    provenance:
      source_url: https://www.fylehq.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Business. Unlimited expense tracking and real-time card feeds. $14.99 per active user*/month, billed annually. Minimum billing: 10 users." All Growth features plus multi-org/multi-stage approvals, ACH reimbursements (US only), project expense tracking, multi-currency/multi-region, Sage Intacct/Sage 300 integrations, named account manager.'

