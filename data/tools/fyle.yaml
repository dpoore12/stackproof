findings:
  - id: fyle-minimum-billed-users
    claim: >-
      Fyle (Sage Expense Management) enforces a minimum billed-user floor
      regardless of actual usage: 5 users on Growth ($59.95/month minimum)
      and 10 users on Business ($149.90/month minimum), even for a team
      with fewer active users (2026-09-04).
    provenance:
      source_url: https://www.fylehq.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: fyle-active-user-definition
    claim: >-
      Fyle (Sage Expense Management) defines a billable "active user" as
      someone who "create[s] at least one expense or ha[s] a credit card
      connected... with active transactions," so employees with no
      expense activity in a period are not charged (2026-09-04).
    provenance:
      source_url: https://www.fylehq.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: fyle-enterprise-headcount-gate
    claim: >-
      Fyle's (Sage Expense Management) Enterprise tier is quote-only and
      explicitly scoped to "enterprises with 250+ employees," with several
      Business-tier integrations (Sage Intacct, Sage 300, QuickBooks
      Desktop) carrying additional implementation or per-product fees on
      top of the subscription (2026-09-04).
    provenance:
      source_url: https://www.fylehq.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
