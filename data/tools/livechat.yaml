findings:
  - id: livechat-prices-usd-annual-monthly
    claim: >-
      On 2026-09-03 LiveChat listed Starter at $19, Team at $49 and Business
      at $79 per month billed annually, or $25, $59 and $89 billed monthly,
      all in USD.
    provenance:
      source_url: https://www.livechat.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: livechat-monthly-premium
    claim: >-
      LiveChat's monthly billing costs $6 to $10 more per month than annual,
      a 13% to 32% premium across its 3 self-serve plans (2026-09-03).
    provenance:
      source_url: https://www.livechat.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: livechat-chatbot-addon
    claim: >-
      AI chatbots are not included in LiveChat's plans; the ChatBot.com
      add-on starts at $52 per month billed annually on top of the seat
      price (2026-09-03).
    provenance:
      source_url: https://www.livechat.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: livechat-reply-suggestion-sources
    claim: >-
      LiveChat's AI reply suggestions draw on 3 knowledge sources on Team
      and 10 on Business and Enterprise, with none listed for Starter
      (2026-09-03).
    provenance:
      source_url: https://www.livechat.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: livechat-five-agent-cost
    claim: >-
      At LiveChat's 2026-09-03 annual rates a 5-agent team pays $245 per
      month on Team or $395 on Business, against $95 on Freshdesk Growth for
      5 agents.
    provenance:
      source_url: https://www.livechat.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
