clauses:
  - topic: cancellation
    status: stated
    quote: "Downgrades and cancellations take effect at the end of your current term. Miro plans auto-renew which means that if you don't want to be charged for the next period, cancel before your renewal date."
    finding: >-
      Miro states that plan downgrades and cancellations take effect at
      the end of the current billing term, and that plans auto-renew
      unless cancelled before the renewal date (2026-09-04).
    provenance:
      source_url: https://miro.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    quote: "Miro plans are priced per seat. On the Free plan, all users are free. If you're on a Starter or Business plan, you're charged for every member added to your workspace. Charges are prorated, so members added mid-cycle are only billed for the remaining days until the next billing cycle starts."
    finding: >-
      Miro prorates mid-cycle seat additions, charging only for the
      remaining days in the current billing cycle (2026-09-04).
    provenance:
      source_url: https://miro.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: not_stated
    finding: >-
      Miro's pricing page and FAQ state no money-back-guarantee or refund
      terms (2026-09-04).
    provenance:
      source_url: https://miro.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: miro-guest-vs-member-seat
    claim: >-
      Miro's FAQ defines the billed unit: "Members consume a paid seat...
      Guests have a free Miro account and do not consume a paid seat, but
      are only invited to specific boards" (2026-09-04).
    provenance:
      source_url: https://miro.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: miro-startup-credit-program
    claim: >-
      Miro offers eligible startups $1,000 in credits if connected to a
      partner accelerator/VC, or $500 for independent startups with fewer
      than 30 employees (2026-09-04).
    provenance:
      source_url: https://miro.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: miro-ai-credits-pooled
    claim: >-
      Miro pools each plan's monthly AI-credit allotment across the whole
      organization rather than per user, and unused credits do not roll
      over to the next month (2026-09-04).
    provenance:
      source_url: https://miro.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
