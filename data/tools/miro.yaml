free_trial: "Business plan can be tried free before buying; Free plan itself runs indefinitely with unlimited team members and 3 editable boards (2026-09-04)."
pricing_note: "Miro prices per seat: only invited collaborators who become full \"Members\" consume a paid seat. Guests (limited access to specific boards) and Visitors (public link access) are free at every plan and do not count toward billing. The page's default toggle showed annual billing (\"Yearly, save 20%\"); the monthly-billing dollar figure exists behind the same toggle but was not captured by this static fetch."

