findings:
  - id: dubsado-additional-user-brackets
    claim: >-
      Dubsado includes 3 additional users free on either plan, then charges
      "4–10 users: $25/mo. 11–20 users: $45/mo. 21–30 users: $60/mo. For
      30+ users, send us an email" per its own pricing page, though it does
      not state whether that count is additional or total seats (2026-09-04).
    provenance:
      source_url: https://www.dubsado.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: dubsado-120k-businesses
    claim: >-
      Dubsado states "120,000 business owners worldwide trust Dubsado" on
      its own pricing page (2026-09-04).
    provenance:
      source_url: https://www.dubsado.com/pricing
