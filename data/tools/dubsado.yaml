category: wedding_event_planning
url: https://www.dubsado.com/pricing
pricing_note: 'Dubsado is a general small-business client-management CRM (also used by photographers, coaches, and consultants), not wedding-specific, but is widely used by wedding and event planners. Both plans state "Unlimited projects & clients," so pricing gates on team seats rather than event volume. Dubsado includes 3 additional users free (4 seats total) on either plan, then charges a flat additional fee per user bracket (4-10/11-20/21-30 additional or total users — the page does not say which). Because that bracket count is ambiguous, `max_seats` is set to 4 (the free-tier ceiling) rather than guessed at, and the bracket pricing is captured only as a Finding.'

