findings:
  - id: duda-plan-prices-annual-monthly
    claim: >-
      On 2026-09-04 Duda listed Basic at $19, Team at $29, Agency at $52 and
      White Label at $149 per month billed annually, or $25, $39, $69 and
      $199 billed monthly.
    provenance:
      source_url: https://www.duda.co/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: duda-included-sites
    claim: >-
      Duda's Basic and Team plans include 1 published site and Agency and
      White Label include 4, so 4 sites cost $52 per month on Agency against
      $60 for 4 Webflow Basic sites (2026-09-04).
    provenance:
      source_url: https://www.duda.co/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: duda-team-seats
    claim: >-
      Duda's Team plan includes 3 team seats and Agency and White Label 6,
      with unlimited client workspaces on all paid plans (2026-09-04).
    provenance:
      source_url: https://www.duda.co/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: duda-money-back-guarantee
    claim: >-
      Duda pairs a 14-day no-card trial with a 30-day money-back guarantee,
      terms Webflow's pricing page does not state (2026-09-04).
    provenance:
      source_url: https://www.duda.co/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: duda-monthly-premium
    claim: >-
      Duda's monthly billing runs $6 to $50 above its annual rates, a 25% to
      34% premium across the 4 self-serve plans (2026-09-04).
    provenance:
      source_url: https://www.duda.co/pricing
      fetched_at: 2026-09-04
      method: live_fetch
