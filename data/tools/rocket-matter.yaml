findings:
  - id: rocket-matter-esignature-overage
    claim: >-
      Rocket Matter caps included e-signatures per user per month by
      tier and charges "$2 per envelope" beyond the cap: 5/user/month on
      Essentials versus 15/user/month on Pro, Premier, and Elite
      (2026-09-04).
    provenance:
      source_url: https://www.rocketmatter.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: rocket-matter-website-addon
    claim: >-
      Rocket Matter offers an optional turnkey website add-on, available
      on all four plans, for "+$149/month" billed annually plus a
      one-time $599 setup fee (2026-09-04).
    provenance:
      source_url: https://www.rocketmatter.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
