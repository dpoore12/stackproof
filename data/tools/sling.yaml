slug: sling
vendor: Sling (by Toast)
product: Sling
category: shift_scheduling
url: https://getsling.com/pricing/
free_trial: "15-day free trial across all plans; core scheduling stays free indefinitely for up to 30 users regardless of trial status (2026-09-04)."
pricing_note: "Sling's Free plan is unusually generous for this category: full shift scheduling for up to 30 users at $0. Sling also has a buyer-friendly \"fair billing policy\": deactivated or removed users are prorated back to the account rather than paid through the full period."

