clauses:
  - topic: billing_timing
    status: stated
    quote: "With Sling's Premium and Business plans, you only pay for the people who use the platform. If a team member leaves or is deactivated, we'll prorate your account for the unused spot."
    finding: >-
      Sling prorates a refund-in-kind (account credit) for any seat
      deactivated mid-cycle, rather than charging through the full
      period (2026-09-04).
    provenance:
      source_url: https://getsling.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: cancellation
    status: stated
    quote: "If an employee leaves your business, you can deactivate or remove them from your Sling account. We'll prorate you for the unused time in both cases."
    finding: >-
      Sling lets individual employee seats be deactivated at any time
      with prorated billing adjustment (2026-09-04).
    provenance:
      source_url: https://getsling.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: not_stated
    finding: >-
      Sling's pricing FAQ states no plan-level money-back-guarantee,
      beyond its per-seat proration policy (2026-09-04).
    provenance:
      source_url: https://getsling.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: sling-free-tier-30-users
    claim: >-
      Sling's free plan supports full shift scheduling for up to 30
      users at $0, a higher free-tier ceiling than any other vendor
      recorded in this category (2026-09-04).
    provenance:
      source_url: https://getsling.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: sling-fair-billing-proration
    claim: >-
      Sling's "fair billing policy" prorates Premium and Business
      accounts for any seat left unused after an employee departs,
      rather than billing the full period (2026-09-04).
    provenance:
      source_url: https://getsling.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
