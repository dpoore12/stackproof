pricing_note: "Kickserv's page has a Monthly/Annual toggle and states \"Save 20% with annual subscription,\" but this fetch only captured one toggle state (recorded below as monthly billing) -- the discounted annual figure itself was not rendered statically. None of the three plans state a per-additional-user overage rate, so each is capped at exactly its stated included-user count rather than extrapolated."

