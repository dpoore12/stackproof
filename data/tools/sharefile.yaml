clauses:
  - topic: billing_timing
    status: stated
    quote: "Your selected billing cycle remains fixed for the term of the subscription... If you begin with a monthly plan, you can upgrade to an annual or multi-year plan at any time to take advantage of cost savings. However, downgrading from annual or multi-year billing back to monthly is not currently supported."
    finding: >-
      ShareFile's FAQ states customers can upgrade from monthly to annual
      billing at any time but cannot downgrade from annual back to monthly
      (2026-09-04).
