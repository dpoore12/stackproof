findings:
  - id: sharefile-client-users-free
    claim: >-
      ShareFile's FAQ states all plans include unlimited external client
      users at no charge; only internal employee users count toward the
      3-to-5-user minimum and per-seat price (2026-09-04).
    provenance:
      source_url: https://www.sharefile.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
  - id: sharefile-no-annual-downgrade
    claim: >-
      ShareFile allows upgrading from monthly to annual billing at any
      time but does not support downgrading from annual or multi-year
      billing back to monthly, per its own FAQ (2026-09-04).
    provenance:
      source_url: https://www.sharefile.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
  - id: sharefile-price-ladder
    claim: >-
      ShareFile prices Advanced at $16.50, Premium at $26.00, Industry
      Advantage at $41.66 and Virtual Data Room at $69.30 per employee user
      a month billed annually, so the top priced tier costs over 4 times
      the entry tier (2026-09-04).
    provenance:
      source_url: https://www.sharefile.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
  - id: sharefile-esignature-gate
    claim: >-
      ShareFile includes integrated e-signature "at no extra cost" starting
      at the Premium plan, alongside HIPAA, FINRA and SEC compliance
      support (2026-09-04).
    provenance:
      source_url: https://www.sharefile.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
  - id: sharefile-accounting-tier
    claim: >-
      ShareFile sells a dedicated Industry Advantage tier priced above
      Premium specifically for accounting firms, with pre-built tax
      engagement templates and bulk client onboarding (2026-09-04).
    provenance:
      source_url: https://www.sharefile.com/plans
      fetched_at: 2026-09-04
      method: live_fetch
