pricing_note: "Per-employee-user pricing with a 3-user minimum on Advanced, Premium and Industry Advantage, and a 5-user minimum on Virtual Data Room. Every plan includes unlimited external client users at no charge; only internal employee users count toward the seat price. Annual billing is shown alongside monthly billing on the same card at a consistent ~9% discount; standard (annual) figures are the compare tiers, with a monthly-billed variant recorded separately. Enterprise is quote-only and not priced here."

