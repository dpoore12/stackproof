findings:
  - id: jobber-flat-per-user-overage
    claim: >-
      Jobber charges a flat "$29/mo each" for additional users beyond a
      plan's included seats, stated identically across all four of its
      plans (Core, Connect, Grow, Plus) with no cap mentioned (2026-09-04).
    provenance:
      source_url: https://www.getjobber.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: jobber-one-year-commitment-tier
    claim: >-
      Jobber offers a middle billing tier -- "1 year commitment," billed
      monthly -- priced between its month-to-month rate and its prepaid
      annual rate on every plan; on Core this is $39/month versus $49
      (no commitment) and $29 (billed annually) (2026-09-04).
    provenance:
      source_url: https://www.getjobber.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
