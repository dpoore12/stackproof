pricing_note: "Jobber shows three billing options per plan at that plan's included-seat count: month-to-month (\"No commitment\"), a mid-discount \"1 year commitment\" billed monthly, and the best-discount \"Billed annually.\" Only the two extremes (no-commitment monthly and billed-annually) are recorded as tiers here; the middle 1-year-commitment rate is captured as a finding instead of a third tier, to avoid tripling the tier count across four plans."

