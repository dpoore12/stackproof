findings:
  - id: tailscale-domain-based-tier-detection
    claim: >-
      Tailscale's FAQ states tier assignment is automatic by email
      domain: a public domain like Gmail is "treated as personal use"
      and stays free, while a custom domain is "considered business use"
      and auto-enrolls in a paid trial (2026-09-04).
    provenance:
      source_url: https://tailscale.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: tailscale-tagged-resource-overage
    claim: >-
      Tailscale includes 50 tagged resources (such as exit nodes) per
      month on Standard and Premium, then charges "$1 per month for every
      tagged resource" beyond that (2026-09-04).
    provenance:
      source_url: https://tailscale.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: tailscale-price-ladder
    claim: >-
      Tailscale prices Standard at $8 and Premium at $18 per user a
      month, both billed monthly, more than double between the two
      self-serve tiers, with Enterprise above that at a custom price
      (2026-09-04).
    provenance:
      source_url: https://tailscale.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
