clauses:
  - topic: cancellation
    status: stated
    finding: >-
      Zoho Workplace is pay-as-you-go with no long-term contract and can be
      upgraded, downgraded or cancelled at any time from the account
      (2026-09-04).
    quote: "Zoho Workplace is a pay-as-you-go service (monthly or yearly). This means there are no long-term contracts."
    provenance:
      source_url: https://www.zoho.com/workplace/pricing.html
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: needs_account
    finding: >-
      Zoho Workplace's pricing page links to a separate refund policy
      without stating its terms (2026-09-04).
    provenance:
      source_url: https://www.zoho.com/workplace/pricing.html
      fetched_at: 2026-09-04
      method: not_available
  - topic: billing_timing
    status: stated
    finding: >-
      Zoho charges local taxes on top of the listed prices and gives an
      approximate 20% discount for annual billing that may vary by region
      (2026-09-04).
    quote: "Local taxes (VAT, GST, etc.) will be charged in addition to the prices mentioned."
    provenance:
      source_url: https://www.zoho.com/workplace/pricing.html
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      Zoho Workplace's pricing page states no data-export terms
      (2026-09-04).
    provenance:
      source_url: https://www.zoho.com/workplace/pricing.html
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: zoho-workplace-no-free-seats-on-paid
    claim: >-
      Zoho Workplace bills every user on a paid plan; the 5 free users apply
      only to the Free Mail plan, so 5 users on Mail Premium cost 5 × $4 a
      month (2026-09-04).
    provenance:
      source_url: https://www.zoho.com/workplace/pricing.html
      fetched_at: 2026-09-04
      method: live_fetch
  - id: zoho-workplace-storage-add-on-anomaly
    claim: >-
      Zoho Workplace's WorkDrive storage add-on is printed at $144 a year
      for 100 GB but $100 a year for 1 TB, so 10 times the storage costs
      less (2026-09-04).
    provenance:
      source_url: https://www.zoho.com/workplace/pricing.html
      fetched_at: 2026-09-04
      method: live_fetch
  - id: zoho-workplace-team-storage-rule
    claim: >-
      Zoho Workplace Standard pools 100 GB of file storage for teams of 3 to
      10 users, adds 10 GB per user above 10, and gives 10 GB per user to
      teams under 3; Professional uses 1 TB and 100 GB on the same rule
      (2026-09-04).
    provenance:
      source_url: https://www.zoho.com/workplace/pricing.html
      fetched_at: 2026-09-04
      method: live_fetch
  - id: zoho-workplace-geo-redirect
    claim: >-
      On 2026-09-04 a German gateway was redirected to zoho.com/de with EUR
      prices (€2.70 Standard, €5.40 Professional annual) while a US gateway
      got the English page in USD ($3 and $6).
    provenance:
      source_url: https://www.zoho.com/workplace/pricing.html
      fetched_at: 2026-09-04
      method: live_fetch
