pricing_note: 'Figures recorded are MoeGo''s "Mobile grooming" pricing view, the default shown on its pricing page; a "Grooming salon" tab also exists on the same page with reportedly higher prices that this fetch could not switch to and confirm, so only the mobile-grooming tiers are recorded. Basic is genuinely capped at 1 team member per MoeGo''s own comparison table; Growth and Ultimate both list "Unlimited" team members and differ only by features, so at any team size above 1 this site''s cost table will always show Growth as MoeGo''s cheapest usable tier. Enterprise is quote-gated and excluded.'

