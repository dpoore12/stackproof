findings:
  - id: learnworlds-starter-enrollment-fee
    claim: >-
      LearnWorlds' Starter plan charges "$5 per paid enrollment" on top
      of its $24/month base price, a fee waived on every higher tier
      (2026-09-04).
    provenance:
      source_url: https://www.learnworlds.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: learnworlds-active-learner-cap
    claim: >-
      LearnWorlds caps its Starter plan at "1,000 active learners /
      month" and its Pro Trainer and Learning Center plans at "2,000
      active learners / month" each (2026-09-04).
    provenance:
      source_url: https://www.learnworlds.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

fees:
  - name: Starter plan enrollment fee
    amount_usd: 5
    unit: per paid enrollment (Starter plan only; Pro Trainer, Learning Center and Corporate all state "no enrollment fees")
    provenance:
      source_url: https://www.learnworlds.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch

clauses:
  - topic: cancellation
