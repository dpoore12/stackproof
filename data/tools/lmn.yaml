pricing_note: 'LMN (sold under parent company Granum) prices flat per tier with a bundled license cap rather than a per-seat multiplier: Starter includes 1 office/crew lead + 5 crew member licenses (6 total), Professional includes 3 office/crew lead + 15 crew member licenses (18 total). "Additional licenses are available for a fee" on both tiers, but no per-seat dollar rate is published anywhere on the page -- the only nearby dollar figure is for an unrelated SMS add-on -- so cost beyond each tier''s included license count is not captured, and `max_seats` is set to that included count rather than assumed unlimited.'

