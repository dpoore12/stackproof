free_trial: "14-day free trial on Home, Teams, and Business plans (stated 2026-09-04)."
pricing_note: "Home ($15/month flat, not per-user) is a non-commercial homelab tier and is excluded from comparison here. Teams and Business monthly prices are shown directly on the page with a stated 'Yearly -15%' discount; the annual per-user rate is derived by applying that stated 15% to the monthly rate, since the compare table's own annual-column figures did not reconcile with the stated discount percentage and are not trusted as printed. Every device a user connects with (up to 5 per user across all tiers) counts toward a separate 'User devices' allotment, not an extra seat."

