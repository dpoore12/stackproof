findings:
  - id: twingate-device-allotment
    claim: >-
      Every Twingate tier, including Enterprise, allots exactly 5 devices
      per user for accessing protected resources, regardless of plan
      price (2026-09-04).
    provenance:
      source_url: https://www.twingate.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: twingate-dns-filtering-addon
    claim: >-
      Twingate's Business plan feature list marks "DNS filtering" with an
      asterisk noted as "Available as add-on," so it is not included in
      the base $10/user/month price despite appearing in the plan's
      feature list (2026-09-04).
    provenance:
      source_url: https://www.twingate.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: twingate-user-cap-ladder
    claim: >-
      Twingate hard-caps account size by tier: 5 users on Starter, 100 on
      Teams, and 500 on Business, with Enterprise offering custom account
      sizes above that (2026-09-04).
    provenance:
      source_url: https://www.twingate.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
