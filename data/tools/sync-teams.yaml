findings:
  - id: sync-half-off-year-one
    claim: >-
      Sync.com runs a sitewide "Save 50% off for 1 year" promo across every
      Teams tier, so a Teams 1TB seat lists at $6 a month billed annually
      but strikes to $3 for new customers' first year (2026-09-04).
    provenance:
      source_url: https://www.sync.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: sync-seat-minimum
    claim: >-
      Every Sync.com Teams tier requires a minimum of 3 users, so the
      cheapest Teams 1TB plan costs $18 a month billed annually (standard
      rate) regardless of team size below 3 (2026-09-04).
    provenance:
      source_url: https://www.sync.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: sync-enterprise-gate
    claim: >-
      Sync Enterprise requires a minimum of 100 users and is quote-only,
      positioned above the priced Teams 10TB tier for "org-wide controls"
      (2026-09-04).
    provenance:
      source_url: https://www.sync.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - id: sync-no-setup-fees
    claim: >-
      Sync.com states there are no hidden costs or setup fees on any Teams
      plan, and that plan upgrades are pro-rated (2026-09-04).
    provenance:
      source_url: https://www.sync.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
