clauses:
  - topic: cancellation
    status: stated
    quote: "You can start now and cancel anytime."
    finding: >-
      Sync.com's pricing FAQ states customers on its 30-day free trial "can
      start now and cancel anytime" (2026-09-04).
    provenance:
      source_url: https://www.sync.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: stated
    quote: "Full 30-day money back guarantee."
    finding: >-
      Sync.com states a full 30-day money-back guarantee on its compare-plans
      section, separate from the 30-day free trial (2026-09-04).
    provenance:
      source_url: https://www.sync.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    quote: "There are no hidden costs or setup fees, and you can upgrade or change plans at any time (upgrades are always pro-rated for fair billing)."
    finding: >-
      Sync.com states plan upgrades are always pro-rated and that there are
      no hidden costs or setup fees (2026-09-04).
    provenance:
      source_url: https://www.sync.com/pricing/
      fetched_at: 2026-09-04
      method: live_fetch
