pricing_note: 'Trackops has a genuine base-plus-per-seat formula on every tier: each plan includes 2 Full Access Staff (investigators with access to all cases), with additional Full Access staff billed per-seat at a rate that varies by tier. "Unlimited Limited Access Staff" (view-only, access to only their own cases) are not counted toward the seat total.'

