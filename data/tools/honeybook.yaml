slug: honeybook
vendor: HoneyBook
product: HoneyBook
category: wedding_event_planning
url: https://www.honeybook.com/pricing
pricing_note: 'HoneyBook is a general small-business CRM (also used by photographers, coaches, and freelancers) rather than a wedding/event-specific tool, but it is one of the most common client-management platforms among wedding and event planners and explicitly states "Unlimited clients and projects" on every tier, so its pricing gates on team seats, not event/project volume. Starter''s own feature list never mentions team members at all, while Essentials adds "Up to 2 team members" and Premium adds "Unlimited team members" as their headline new capability — so Starter is treated as a 1-seat plan by that omission, not a stated digit.'

tiers:
  - plan: Starter
    base_monthly_usd: 29
    max_seats: 1
    seat_label: user
    billing: annual
    provenance:
      source_url: https://www.honeybook.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"$29/month (billed yearly)." Feature list: "Unlimited clients and projects, Invoices and payments, Proposals and contracts, Calendar, All professional templates, Client portal, Basic reports, Up to 2 live lead forms, HoneyBook AI." No team-member line is listed for this tier.'
  - plan: Essentials
    base_monthly_usd: 49
