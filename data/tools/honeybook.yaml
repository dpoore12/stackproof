      method: live_fetch
      note: 'Marked "Most Popular." "$49/month (billed yearly)." Feature list adds: "Scheduler, Automations, QuickBooks Online integration, Up to 2 team members, Up to 10 live lead forms, SMS reminders..."'
  - plan: Essentials (monthly billing)
