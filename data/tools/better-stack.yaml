findings:
  - id: better-stack-unlimited-team-members
    claim: >-
      Better Stack does not charge per team member at any plan: only
      "Responder" on-call licenses cost money, at $34/month or $29/month
      billed annually, while ordinary team members stay free and unlimited
      (2026-09-04).
    provenance:
      source_url: https://betterstack.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: better-stack-ai-sre-pricing
    claim: >-
      Better Stack prices its "AI SRE" incident-investigation chat feature
      at $5 per million tokens, on top of any plan (2026-09-04).
    provenance:
      source_url: https://betterstack.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: better-stack-soc2-compliant
    claim: >-
      Better Stack's pricing-page FAQ states, "Yes, Better Stack is SOC2
      Type 2 compliant. Contact us for more details or to access the
      latest report" (2026-09-04).
    provenance:
      source_url: https://betterstack.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
