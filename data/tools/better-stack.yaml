slug: better-stack
vendor: Better Stack
product: Better Stack (Uptime, Incident Management & Status Pages)
category: uptime_monitoring
url: https://betterstack.com/pricing
free_trial: "No credit-card-gated trial found on the pricing page; the Free plan (10 monitors/heartbeats, 1 status page) runs indefinitely at $0, and a paid Responder license can be added at any time with no separate trial step (2026-09-04)."
pricing_note: "Better Stack does not charge per team member: \"Unlimited team members\" are free at every plan, including Free. The only per-person charge is a $34/month ($29/month billed annually) \"Responder\" license, which is what gives someone on-call phone/SMS paging and dashboard access to incident management, monitoring and status pages. Because this category's comparison axis is team members with monitoring/alerting access, Responder licenses are used as the seat count here; a team that only needs read-only visibility, not paging, pays nothing per person beyond the base monitor/status-page limits."

tiers:
  - plan: Free
    compare: false
    base_monthly_usd: 0
    per_seat_monthly_usd: 0
    max_seats: 0
    seat_label: responder (paid on-call license)
    billing: monthly
    provenance:
      source_url: https://betterstack.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Free for personal projects. $0 per month. 10 monitors & heartbeats, 1 status page. Slack & e-mail alerts. 100,000 exceptions per month. 5,000 session replays." "Unlimited team members" can view and receive Slack/e-mail alerts, but Free includes 0 paid Responder licenses, so phone-call/SMS on-call paging is not available.'
  - plan: Responder (annual)
    base_monthly_usd: 0
    per_seat_monthly_usd: 29
    included_seats: 0
    seat_label: responder (paid on-call license)
    billing: annual
    provenance:
      source_url: https://betterstack.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Responder. Access to Uptime with incident management, on-call, monitoring and status pages with unlimited phone call and SMS alerts. $29 per license per month" (annual billing). "Includes a single responder with unlimited phone call alerts so that you can leverage the entire platform."'
  - plan: Responder (monthly)
    compare: false
    base_monthly_usd: 0
    per_seat_monthly_usd: 34
    included_seats: 0
    seat_label: responder (paid on-call license)
    billing: monthly
    provenance:
      source_url: https://betterstack.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"$34 per license per month" billed month-to-month, versus $29/month billed annually.'

