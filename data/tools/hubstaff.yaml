slug: hubstaff
vendor: Hubstaff
product: Hubstaff
category: time_tracking
url: https://hubstaff.com/pricing
free_trial: "14-day free trial, no credit card, plus a 30-day money-back guarantee on paid plans (stated 2026-09-04)."
pricing_note: "Per-seat pricing with a 2-seat minimum on Starter, Grow and Team, modelled as a base fee covering 2 seats. The page defaults to annual billing ('2 months free') and the monthly switch did not re-render in the automated fetch, so only annual rates are recorded. Several features are paid add-ons per seat."

