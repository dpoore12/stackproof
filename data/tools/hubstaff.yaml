      note: '"Insights $2.50 / seat / mo" in the add-ons table; "Starts at $2.5 seat/annual rate".'
  - name: More screenshots add-on
    amount_usd: 2.5
    unit: per seat per month
    applies_to: All plans
    provenance:
      source_url: https://hubstaff.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"More screenshots $2.50 / seat / mo" on every column; up to 10 screenshots every 10 minutes.'
  - name: Data retention add-on
    amount_usd: 1.67
    unit: per seat per month
    applies_to: All plans
    provenance:
