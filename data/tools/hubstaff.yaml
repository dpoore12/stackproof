    amount_usd: 3.33
    unit: per seat per month
    applies_to: Team only (not available on Starter or Grow; included on Enterprise)
    provenance:
      source_url: https://hubstaff.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Locations — Not available / Not available / $3.33 / seat / mo / Included".'
  - name: Silent app add-on
    amount_usd: 2.5
    unit: per seat per month
    applies_to: Starter, Grow and Team (included on Enterprise)
    provenance:
      source_url: https://hubstaff.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
      note: '"Silent app $2.50 / seat / mo".'

clauses:
  - topic: cancellation
    status: stated
    finding: >-
      Hubstaff cancels a subscription on request to support or when the
      organization is archived; removed seats earn no prorated refund or
      credit (2026-09-04).
    quote: "Archive the organization associated with your subscription. Doing so will automatically cancel your subscription."
    provenance:
      source_url: https://hubstaff.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: refund
    status: stated
    finding: >-
      Hubstaff refunds on request within 30 days of starting a paid plan,
      but not for individual users removed from a plan (2026-09-04).
    quote: "we offer a 30-day money-back guarantee, excluding our 14-day free trial"
    provenance:
      source_url: https://hubstaff.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: billing_timing
    status: stated
    finding: >-
      Hubstaff prorates seats added mid-term on annual plans ($60 for a
      $10 seat added in July of a January cycle) but charges the full
      monthly rate with no proration for seats added on monthly plans
      (2026-09-04).
    quote: "If you add users to your monthly plan, they will be charged the full monthly rate for that billing cycle, with no proration."
    provenance:
      source_url: https://hubstaff.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - topic: data_export
    status: not_stated
    finding: >-
      Hubstaff's pricing page states no data-export terms; it sells a
      6-year data-retention add-on at $1.67 per seat (2026-09-04).
    provenance:
      source_url: https://hubstaff.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch

findings:
  - id: hubstaff-two-seat-minimum
    claim: >-
      Hubstaff's Starter, Grow and Team plans carry a 2-seat minimum, so a
      solo user pays $9.98 a month on Starter on annual billing, and every
      member who tracks time needs a paid seat (2026-09-04).
    provenance:
      source_url: https://hubstaff.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: hubstaff-addon-stack
    claim: >-
      Hubstaff sells Insights, More screenshots, Silent app ($2.50 each),
      Data retention ($1.67) and Locations ($3.33) as per-seat monthly
      add-ons, so a Starter seat with 3 add-ons costs more than a Team seat
      (2026-09-04).
    provenance:
      source_url: https://hubstaff.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: hubstaff-vip-support-fees
    claim: >-
      Hubstaff charges $29 a month per organization for "Enhanced" VIP
      support on subscriptions of $275 to $400 a month and $59 for "The
      works" above $400 (2026-09-04).
    provenance:
      source_url: https://hubstaff.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
  - id: hubstaff-screenshot-caps
    claim: >-
      Hubstaff caps screenshots and app/URL tracking at 500 per seat a
      month on Starter and 1,500 on Grow, with Team unlimited; email
      support SLAs run 2 days, 1 day, 1 day and 2 hours by plan
      (2026-09-04).
    provenance:
      source_url: https://hubstaff.com/pricing
      fetched_at: 2026-09-04
      method: live_fetch
