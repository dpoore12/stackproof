pricing_note: 'Orderry is a multi-industry field-service/repair management platform used across several trades — not repair-shop-exclusive — but it explicitly names "Electronics Repair Shop Software" and "Computer Repair Shop" among its solutions. Startup and Business both have a genuine base-plus-per-seat formula (a fixed number of employees included, additional employees billed per-seat up to a stated cap); Hobby is a flat two-employee tier with no per-seat overage disclosed. Enterprise is not modeled (its per-seat terms were not captured in this fetch).'

