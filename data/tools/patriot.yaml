findings:
  - id: patriot-extra-state-fee
    claim: >-
      On 2026-09-03 Patriot's pricing page stated that Full Service Payroll
      charges $12 per month for each additional state it files in beyond the
      first.
    provenance:
      source_url: https://www.patriotsoftware.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: patriot-per-worker-rates
    claim: >-
      Patriot's per-worker rate on 2026-09-03 was $4 (Basic) or $5 (Full
      Service) per worker paid in the month, shown struck through to $2 and
      $2.50 under a 30-days-free plus 50%-off-for-6-months promotion.
    provenance:
      source_url: https://www.patriotsoftware.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: patriot-addon-per-employee-fees
    claim: >-
      Patriot's Time & Attendance and HR add-ons each cost $6 per month plus
      $2 per employee per product at regular price on 2026-09-03.
    provenance:
      source_url: https://www.patriotsoftware.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - id: patriot-billed-in-arrears
    claim: >-
      Patriot bills monthly in arrears, so the first invoice arrives after the
      first month of use rather than at signup (stated 2026-09-03).
    provenance:
      source_url: https://www.patriotsoftware.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
