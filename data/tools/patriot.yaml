clauses:
  - topic: billing_timing
    status: stated
    finding: >-
      Patriot bills payroll in arrears each month as a flat fee plus a
      per-worker-paid fee, with unlimited payroll runs.
    quote: "Our payroll is a flat monthly fee + per worker paid fee. Run as many payrolls as you need. We'll bill you in arrears each month."
    provenance:
      source_url: https://www.patriotsoftware.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
  - topic: accuracy_guarantee
    status: stated
    finding: >-
      Patriot's Full Service plan states "tax filing reliability guaranteed"
      and year-end payroll tax filings at no additional fee.
    provenance:
      source_url: https://www.patriotsoftware.com/pricing/
      fetched_at: 2026-09-03
      method: live_fetch
