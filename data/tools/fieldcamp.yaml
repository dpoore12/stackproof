pricing_note: >-
  FieldCamp is a horizontal field-service tool (also marketed to HVAC,
  plumbing, electrical, landscaping, pest control and other trades),
  included here under this site's "generic tool with a genuine
  dedicated niche landing page" exception — its
  /window-cleaning-software/ page is a real, extensive window-cleaning
  marketing page. Enterprise's "$2,000+/mo" floor with "additional
  users negotiated" is not modeled as a PriceTier since the actual
  cost beyond 25 users is open-ended, not a fixed formula; see the
  finding below.

