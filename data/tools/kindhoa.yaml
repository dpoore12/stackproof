pricing_note: 'KindHOA explicitly markets "No per-unit pricing. Ever." — both tiers are flat regardless of community size. The free "Good Neighbor" tier is a genuine, full self-managed-HOA product (not a limited trial); KindHOA''s own FAQ says it is subsidized by a platform fee on online dues payments (1.2% cards / 1% ACH, capped at $8) rather than by feature limits, and upgrading to Board Automation lowers that platform fee (1% / 0.8%, capped at $5) in addition to adding automation features. Good Neighbor is `compare: false` per this site''s standing rule that a $0 plan never ranks as "cheapest" in a category table.'

